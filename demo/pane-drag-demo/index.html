<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Provident Pane-Drag Demo — store-backed drag, ghost preview, minimized-zone drop</title>
<style>
:root { --zone-border: #c9d1d9; --zone-bg: #0d1117; --pane-bg: #161b22; --ghost-opacity: 0.45; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: #010409; color: #e6edf3; }
#app { display: grid; grid-template-columns: 220px 200px 10px minmax(0, 1fr); grid-template-rows: calc(100vh - 6rem) 3.5rem auto; height: 100vh; gap: 6px; padding: 6px; }
#gutter { grid-column: 3; grid-row: 1; width: 10px; cursor: col-resize; background: #21262d; border-radius: 3px; display: flex; align-items: stretch; position: relative; z-index: 5; }
#gutter .gutter-grip { flex: 1; background: #30363d; margin: 2px 0; border-radius: 2px; }
.pane-size { font-size: 10px; color: #8b949e; padding: 2px 8px; }
#app > .zone, #app > .statusbar { min-width: 0; min-height: 0; }
.statusbar { grid-column: 1 / 5; grid-row: 3; }
#zone-sidebar, #zone-main { height: 100%; min-height: 0; }
#zone-main { grid-column: 2; grid-row: 1; min-width: 0; overflow: hidden; }
#zone-footer { grid-column: 1 / 5; }
.zone { border: 1px dashed var(--zone-border); background: var(--zone-bg); border-radius: 6px; padding: 6px; min-height: 0; display: flex; flex-direction: column; }
.pane-stack { flex: 1; min-height: 0; overflow-y: auto; }
.zone-title { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; pointer-events: none; }
#zone-footer .pane-stack { min-height: 1.5rem; }
.pane-frame { background: var(--pane-bg); border: 1px solid #30363d; border-radius: 4px; margin-bottom: 6px; overflow: hidden; position: relative; z-index: 1; }
.pane-frame.dragging { outline: 2px solid #58a6ff; }
.pane-frame.ghost { opacity: var(--ghost-opacity); box-shadow: 0 0 0 1px #58a6ff inset; }
.pane-head { display: flex; align-items: stretch; gap: 6px; padding: 4px 8px; background: #1c2128; cursor: grab; user-select: none; min-height: 26px; }
.pane-head:active { cursor: grabbing; }
.pane-handle { width: 10px; align-self: stretch; background: #30363d; border-radius: 2px; min-height: 18px; }
.pane-title { font-size: 12px; }
.pane-body { padding: 8px; font-size: 12px; color: #c9d1d9; min-height: 48px; }
.statusbar { grid-column: 1 / 3; grid-row: 3; display:flex; gap: 12px; align-items:center; font-size: 11px; color:#8b949e; padding: 0 6px; }
#log { overflow-y: auto; max-height: 60px; }
</style>
</head>
<body>
<div id="app">
  <section id="zone-sidebar" class="zone" data-zone="zone-1"><p class="zone-title">Zone 1 (source)</p><div class="pane-stack"></div><div class="pane-size" data-size-for="pane-a"></div></section>
  <div id="gutter" class="gutter" data-gutter-for="zone-2"><div class="gutter-grip"></div></div>
  <section id="zone-main" class="zone" data-zone="zone-2"><p class="zone-title">Zone 2 (target)</p><div class="pane-stack"></div></section>
  <section id="zone-footer" class="zone" data-zone="zone-3"><p class="zone-title">Zone 3 (minimized at drag start)</p><div class="pane-stack"></div></section>
</div>
<div class="statusbar">
  <span id="drag-state">idle</span><span id="store-state"></span><span id="log"></span>
</div>
<script type="module" src="./demo.mjs"></script>
</body>
</html>
