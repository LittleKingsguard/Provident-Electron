<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <title>Provident-Electron</title>
  <style>
    /* THE SHELL'S OWN PAGE CSS — Electron chrome, not authored provident data (`AGENTS.md` § "UI authority"), which is
       why it may carry style directly. `color-scheme: light` PINS the one arm this design is painted for: the page's
       backgrounds are `#f4f6f8`/`#fff` and most of its text carries no foreground of its own, so the UA's second arm
       (the `light dark` pair this rule used to declare) painted WHITE text on those light backgrounds whenever the
       desktop's own preference was dark — measured on the real window: the h1, every card h2, the counter's value and
       the group labels all computed `rgb(255, 255, 255)` on `rgb(244, 246, 248)`/`rgb(255, 255, 255)`. `body`'s explicit
       `color` is the SECOND half and not a duplicate of the first: every element that sets no colour of its own inherits
       this one, so the page stays legible even in a realm that ignores `color-scheme` (an older Chromium, a UA stylesheet
       that differs), and the pin keeps the UA's form controls and scrollbars on the light arm with it.
       THE COST, STATED: a user who prefers dark gets light form controls and a light scrollbar. **THE SCROLLBAR HALF OF
       THAT COST IS NOW PAID DOWN THE SHEET AND THE PIN IS NOT THE THING THAT PAYS IT**: the theme rules' dark arm declares
       `scrollbar-color` once, on `body:has([theme="dark"])`, and an inherited property reaches every scroll container in
       the app — so the dark surfaces get a dark thumb and track while `color-scheme` keeps this pin's `light` arm on every
       element in both themes, and the light arm's scrollbars are exactly what the pin paints. The FORM-CONTROL half stands
       as written; `D-247` named this residual and the pair under the theme rules takes it. The app's own dark pair
       is the authored control's (`[theme="dark"]` below), never the desktop preference — the repo reads no environment
       for it (`D-97`), and an arm driven by the desktop's own preference would be the ambient surface that
       `tests/theme.test.ts` X-5 refuses. */
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f4f6f8; color: #1b2430; }

    /* THE APP IS THE PAGE — AND THAT IS THE UI-AUTHORITY RULE, NOT A LAYOUT TASTE. Every element outside the Electron
       shell's own chrome is provident data driven through the graph (`AGENTS.md` § "UI authority"), and this page
       carried a hand-written `<header>` with an `<h1>` and a subtitle above the app: an element outside the graph is
       invisible to `provident.dispatch`, `get_rendered_html` and `get_markdown`, and nothing read either line. Both are
       gone — the app's OWN top-bar is the header now (`D-176`'s charter, `D-230`) — so the shell contributes only the
       host boxes below and no words of its own.
       **`#app` IS `position: fixed; inset: 0` AND NOT A `100%`/`100vh` PAIR**, and the difference is the flow, not a
       figure: a fixed box takes the app out of the document entirely, so no sibling and no future page content can open
       a scroll range under it, and the box it hands down IS the viewport rather than a height this sheet typed. It
       carries no `card` class either — the border, radius and padding that made the app a panel half a page wide are the
       panel's, and the app is not a panel.
       **THE APP-SURFACE THEN NEEDS ONE DECLARATION AND NO MORE**: its own authored `css` (`appRootStyle`) already
       declares `display: flex; flex-direction: column`, so the host gives it the viewport and `height: 100%` makes that
       column viewport-tall — which is what lets the stage's authored `flex: 1 1 0` be the remainder the design says it
       is, instead of the height of its own content.
       `main` KEEPS NO GRID: the page is one window and not a two-column sheet, so the wrapper is the plain block it
       is and the `.layout` rule that made it a grid went with the header it was drawn for. */
    #app { position: fixed; inset: 0; }
    .app-surface { height: 100%; }

    /* THE HEIGHT CHAIN HAD A MISSING LINK ABOVE THE ROOT, AND THAT IS THE FIRST CAUSE OF "STAGE DOESN'T SCROLL" — the
       `min-height: auto` trap below it is only the SECOND. `#app` is fixed and therefore definite, but the envelope's
       template root renders as its CHILD (`.demo-shell`, `src/shared/demo-envelope.ts`'s `template.root`) and the sheet had
       no rule for that box at all: an `auto`-height parent makes a child's `height: 100%` compute to `auto` (CSS 2.1 §10.5),
       so `.app-surface`'s own `height: 100%` resolved to NOTHING, the authored column was its content's height, and every
       descendant — the arrangement, the stage — was sized off content. The stage's authored `overflow: auto` then had no
       box to scroll inside, which is exactly the reported symptom.
       THIS ONE DECLARATION IS THE SAME `100%` THE ROOT'S RULE ALREADY CARRIED, ONE LEVEL UP, and it authors no dimension the
       design does not have: `#app` (viewport) → `.demo-shell` (100%) → `.app-surface` (its `height: 100%`, now resolvable) →
       the authored column, definite. THE OVERLAY NODES ARE SIBLINGS OF THE ROOT AND POSITIONED `fixed`, so they take no
       ground from this box, and the row prototype is `display: none` (#tab-row below): nothing else in it is in flow. */
    .demo-shell { height: 100%; }

    /* AND THE STAGE NEEDS THE ARRANGEMENT TO HAND IT THE REMAINDER — the containment a scroller needs on the BLOCK axis.
       `flex: 1 1 0` makes the row take exactly what the 36px bar, the two full-width zones and the opener leave; `min-height:
       0` is the trap's own cure, because a flex item's default `min-height: auto` refuses to shrink below its content — with
       a definite root that would push the arrangement past the window instead of capping it, and the stage's authored
       `overflow: auto` would again never see an overflowing box (an item's used cross size is then the row's inner height,
       via the row's default `align-items: stretch`, so the stage's height IS this definite figure and its scroll bites).
       NEITHER PROPERTY IS SET INLINE, so this rule wins both: `arrangementStyle` carries `display` and `flex-direction` and
       `stageStyle` carries `flex` and `overflow` — and NO rule here restates one of those four. `flex-basis: 0` also keeps
       the arrangement OUT of any shrinking a short window forces: the top and bottom zones' painted heights are the record's
       figures and they keep their own share, exactly as they did before this pass. THE ZONE ARM AND ITS SIZES ARE UNTOUCHED. */
    .arrangement { flex: 1 1 0; min-height: 0; }

    /* THE ROW AXIS IS A BELT AND NOT THE CURE, SAID PLAINLY SO IT IS NOT MISTAKEN FOR ONE: the `min-width: 0` trap that
       bites a column whose content is wide does NOT bite here, and the reason is the stage's OWN authored `overflow: auto` —
       a flex item's automatic minimum is zero when its overflow is not `visible`, and `auto` is not `visible` on either axis
       — so a wide page inside the stage already scrolls horizontally instead of pushing the two sidebars. Its width is
       definite for the same class of reason: the arrangement is stretched to the root's width and the stage is
       `flex: 1 1 0` in that row. `min-width: 0` is carried as the EXPLICIT form of that fact (the sheet's own belt idiom,
       the grip's `flex: 0 0 auto`), never as its cause, and it loses nothing to an inline declaration because `stageStyle`
       states no `min-*` at all. */
    .stage { min-width: 0; }
    .card { background: #fff; border: 1px solid #d8dde3; border-radius: 8px; padding: 1rem; }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    .counter-value { font-size: 2rem; font-weight: 700; margin: 0 0 0.75rem; }
    .btn { margin-right: 0.5rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    .echo-out { margin-top: 0.75rem; padding: 0.5rem; border: 1px dashed #b9c2cc; min-height: 1.25rem; }
    #status { margin-top: 1rem; font-family: monospace; font-size: 0.75rem; color: #556; }
    /* THE OPERATOR PANES' HOST IS THE ISOLATED SECOND REALM'S MOUNT: KEPT IN THE DOM, TAKEN OUT OF THE FLOW, AND
       NEITHER DELETED NOR HIDDEN. `src/renderer/renderer.ts:1090` (`getElementById('panes')`) hands this element to
       `SecurePanels`, whose own graph scope renders the Security and Debug panes into it — the group toggles,
       `#security-status`, `#security-token` and `#exclusion-control` — as a realm the app Runtime and the MCP endpoints
       cannot see. So it is a mount and not scaffolding: deleting it would render that realm nowhere, and the CSS below
       is the presentation of a graph this sheet does not own.
       **AND `display: none` IS NOT AVAILABLE EITHER, WHICH IS THE OTHER HALF OF WHY THIS RULE LOOKS LIKE THIS**: both
       live legs measure RENDERED BOXES inside it — `npm run panes`' `P-3` requires a NON-ZERO box for a `[data-group]`
       row, and `tests/secure-exclusion-live.mjs`'s `box-nonzero` term does the same for `#exclusion-control` — so a
       hidden or zero-size host would RED a leg in order to fix a layout. The host is therefore `position: fixed` at a negative
       inline offset: a laid-out, painted-off-screen box of the window's own size, keeping its two-column grid, its
       scrolling and every box inside it, taking no width from `#app` and adding no scroll range to the page. */
    #panes {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    #panes .hint { font-size: 0.75rem; color: #667; margin: 0 0 0.75rem; }
    #panes #security-status { font-family: monospace; font-size: 0.8rem; margin-bottom: 0.75rem; color: #445; }
    #panes #security-token label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: #445; }
    #panes .token-row { display: flex; gap: 0.5rem; }
    #panes .token-row input { flex: 1; }
    #panes #group-toggles { border: 1px solid #d8dde3; border-radius: 8px; margin-top: 0.75rem; padding: 0.5rem 0.75rem; }
    #panes #group-toggles label { display: block; padding: 0.25rem 0; }
    .group-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
    .group-row label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
    .error { color: #c0392b; font-size: 0.8rem; margin-top: 0.5rem; }

    /* THE TOP-BAR, ITS TABS ROW, THE CHIPS INSIDE IT AND THE `+` BESIDE IT — PRESENTATION BY CLASS AND BY ID ON AUTHORED
       PROVIDENT NODES, WHICH IS THIS SHEET'S OWN PRECEDENT: `.card`, `.btn` and `.counter-value` are provident nodes too,
       and only their looks are page CSS. The element stays graph data — a `.top-bar` / `.tab-row` node authored by the
       envelope or minted by the graph, and `#tab-add` authored beside the row — so nothing here is a DOM this sheet
       conjured; the sheet dresses nodes it never creates (`AGENTS.md` § "UI authority").
       THE INLINE STYLE WINS ON EVERY PROPERTY IT SETS, so no rule below restates one. `topBarStyle` in
       `src/shared/demo-envelope.ts` declares `display: flex`, `align-items: center`, `flex: 0 0 36px` and
       `-webkit-app-region: drag` on the bar, and `tabAddStyle` declares `-webkit-app-region: no-drag` and
       `flex: 0 0 auto` on the `+`, so this block adds ONLY what the inline css leaves open: a background, a bottom
       border, an inline padding, `box-sizing` and the NAME's colour and size; for the row a flex pair, a gap, a height
       and an `overflow`; and for the `+` its whole look.
       **AND NOTHING IN THIS SHEET OR IN THE ENVELOPE CLAIMS A `width` FOR THE ROW ANY MORE, WHICH IS THE WHOLE FIX.**
       `#tab-rows` used to carry an INLINE `width: env(titlebar-area-width, 100%)` (`D-193`'s measurement) and an explicit
       `width` IS a flex item's BASE SIZE, so the row claimed the ENTIRE free area and the NAME beside it was the box left
       to fight for what remained — which is the crowding the user reported ("narrowing the window until the title and
       window buttons crowd over the tab row doesn't cause a scroll"). The charter's own allocation is that THE SPACE IN
       BETWEEN IS OCCUPIED BY THE TABS ROW (`D-176`), and a remainder is what FLEX computes and no authored figure can:
       the row's `flex: 1 1 auto` with `min-width: 0` takes exactly what the fixed name and the fixed `+` leave, and its
       authored `overflow-x: auto` scrolls the chips when they exceed it. The row is therefore the CONSTRAINED box, and the
       name is the SECOND box that yields — after nothing, and only once the row has nothing left to give — see the name
       rule below.
       AND WHY THE ROW NEEDS DRESSING AT ALL: one minted `.tab-row` rendered as the bare word `landing` — a seat with no
       chip, because the sheet had no rule for it. Its marker is the ATTRIBUTE the paint writes, `props.active` →
       `active="true"` / `active="false"`, so `[active="true"]` is the ONLY signal a stylesheet can key on: the paint
       cannot set a class, and a rule for an `active` class would never fire. This rule keys off the painted attribute for
       exactly that reason.
       THE DRAG REGION IS NOT REINTRODUCED HERE, AND THAT IS THE FIX RATHER THAN AN ABSENCE: no rule below declares
       `-webkit-app-region` at all, and the `no-drag` that used to be INLINE ON THIS ROW is gone with it. It blanketed the
       whole bar — the row's box was the row's own, but the no-drag box covered every pixel of it and no pixel of it was
       draggable. Chromium computes the region as the elements carrying `drag` MINUS the elements carrying `no-drag`, so the
       declaration now stands on the CHIPS and on the `+`: it is authored on the row PROTOTYPE's `css` in
       `src/shared/demo-envelope.ts` (the def-root the mint copies a row's `css` off) and on `tabAddStyle`, which is why it
       reaches every minted chip and the one control and nowhere else. The bar's inline `drag` therefore owns every pixel
       the chips and the `+` do not cover, a click still lands on a chip, and `cursor: pointer` is no longer a claim the
       surrounding bar can falsify. Whether a press truly lands and whether the window truly moves are compositor
       behaviour the rendered markup cannot show (the unseeable family `overflow` belongs to, `D-178`).
       **THE NAME IS AN ELEMENT NOW, AND THAT IS THE USER'S RULING OVER THE ANONYMOUS-RUN FINDING — BOTH THE `D-239`
       CROWDING AND `D-240`'s TWO-LINE WRAP.** The report was *"the overflow also causes the title to switch to two lines"*
       and the ruling was *"make the name an element so it can truncate"*; the node is `#app-name`
       (`src/shared/demo-envelope.ts`'s `APP_NAME_ID`, `css.id` + `props.id` with the string as its `content`), the bar's
       FIRST child, so the bar's order — name, row, `+` — is unchanged. **WHAT AN ANONYMOUS RUN COULD NEVER HAVE, AND WHY
       THE ELEMENT IS THE WHOLE CURE**: a text run is wrapped by CSS in an ANONYMOUS FLEX ITEM that no selector can reach
       (`:first-child` would match `#tab-rows`, the first ELEMENT child, and `::first-letter` styles a glyph rather than the
       item), and `D-240` measured every bar-level lever dead — `overflow: hidden`/`clip` on the bar did NOT zero the run's
       automatic minimum (`117.78px` at a `249px` window), `min-width: 0` on the bar did nothing, and
       `text-overflow: ellipsis` was DEAD because the run has no clipping box of its own to paint an ellipsis in. With an
       element the four declarations below land where they are READ (`overflow: hidden`, `text-overflow: ellipsis`,
       `white-space: nowrap`, `min-width: 0`), so the name truncates to `Providen…` on ONE line instead of wrapping to two
       or pushing the row out from under the platform's controls. `flex: 0 1 auto` is what lets it YIELD: grow `0` keeps the
       name at its own width in a wide window, shrink `1` lets the row and the `+` win the contest for the free area, and
       with `nowrap` plus `overflow: hidden` the automatic minimum is zero, so this box is the one that gives way first.
       **AND THE BAR'S OWN `white-space: normal` IS GONE WITH THE RUN IT WAS THERE FOR** (`D-240`'s measured lever): nothing
       in this sheet declares `white-space` on `.top-bar` any more, so the bar computes the initial `normal` by inheritance
       and no text run stands directly in it. The bar keeps `overflow: hidden` — a clip that cannot hide a control, and the
       residual `D-240` stated below a ~`126px` free area. Chips are unmoved: `.tab-row` and `#app-name` each declare their
       own `nowrap`, and the `+` is a single glyph.
       **AND THE ROW IS A SCROLLER BY REQUIREMENT, NOT BY ACCIDENT** — the user's own words: *"the tabs section of the top-bar
       should scroll in the case of overflow caused by too many tabs"*. So the `overflow` pair that CLIPPED the overflow
       (`hidden` on both axes) is `overflow-x: auto` with `overflow-y: hidden`, and the minted chips carry `flex: 0 0 auto`
       below: a flex child's default `flex-shrink: 1` is the row trying to squeeze labels instead of scrolling them, and
       although its automatic minimum (`min-width: auto` over `nowrap` text) stops it short of actually crushing a label,
       the intent has to be STATED rather than inherited by luck — a chip whose label could wrap or whose padding the
       squeeze could eat is one the row scrolls past instead.
       **THE AXIS IS HORIZONTAL ONLY, AND `overflow-y` IS EXPLICIT**: the overflow this requirement names is the row's
       inline axis, and giving the block axis `auto` would both compute the inline axis' complement into a second scroller
       and eat the chips' height the moment the horizontal bar appeared.
       **WHAT IT COSTS, STATED**: a horizontal scrollbar lands INSIDE the bar's own 36px — the row is `height: 100%` of the
       bar, so the cost is paid in CHIP HEIGHT (roughly half the bar off the chips' content box) and never in the bar's
       height, which stays the measured title-bar figure. Its colour is the THEME PAIR's and no longer the UA's alone: the
       `:root` pin above paints it light in the light arm, and the `scrollbar-color` arm under the theme rules paints it
       dark in the dark arm (that line used to say "Chromium paints it on the light arm" — true of this row's own pass, and
       superseded by the pair rather than reworded away).
       **AND THE DRAG REGION IS UNMOVED BY ALL OF IT**: an `overflow` does not enter the compositor's region computation —
       the region is the `drag` elements MINUS the `no-drag` ones — no rule here declares `-webkit-app-region`,
       `#tab-rows` keeps carrying NONE (a blanket `no-drag` here is `D-232`'s defect: a `no-drag` on the row swallowed every
       draggable pixel of the bar), and the chips keep the `no-drag` the mint copies onto each of them from the def-root
       prototype. Whether a PRESS ON THE SCROLLBAR THUMB is claimed by the drag region above it is compositor behaviour this
       sheet cannot read (the unseeable family, `D-178`); the wheel scrolls the row either way, and the cure for it must
       never be a `no-drag` on the container. */

    /* **THE FREE AREA IS THE BAR'S WIDTH, AND THAT IS THE CLAIM `D-239` DELETED FROM THE ROW AND NEVER RE-HOMED.**
       `D-193` measured `env(titlebar-area-width)` resolving to `607px` on a `720`-wide window (`607 = 720 − 113`,
       the platform's three controls owning the rest), so the variable IS the free area WITH THE CONTROLS EXCLUDED —
       and it was the ROW that carried it. Deleting it there was right (an explicit `width` is a flex BASE SIZE, so it
       stole the name's ground) but it left NOTHING bounding the bar: the root's column stretches the bar to the
       WINDOW's width, so the bar's content — name, row, `+` — ran to the window's edge and under the platform's
       buttons, which is exactly the reported screenshot at `249px` wide ("scroll happens only after the tab row is
       covered by the buttons"). Declared HERE, the bar IS the free area, and the row's `flex: 1 1 auto; min-width: 0`
       then computes a remainder that ENDS BEFORE THE CONTROLS — the space in between, which is the charter's own
       allocation (`D-176`).
       `box-sizing: border-box` IS LOAD-BEARING AND NOT DECORATION: the inline padding below is `0 0.75rem`, and
       without the border-box arm `env(...)` would be the CONTENT box, so the bar would measure `env()` PLUS its
       padding and overrun the free area by `1.5rem` — the same crowding by a slimmer margin.
       THE FALLBACK IS WHY THE DECLARATION CARRIES ONE: where `env(titlebar-area-width)` does not resolve (no window
       controls overlay, another platform, an older Chromium) it computes the `100%` arm, which is the pre-change
       full-window bar — sane, and never a zero-width strip. */
    .top-bar {
      box-sizing: border-box;
      width: env(titlebar-area-width, 100%);
      padding: 0 0.75rem;
      /* **THE BAR CLIPS AND NO LONGER DECLARES `white-space`, BECAUSE THE RUN THAT NEEDED IT IS A NODE NOW.** `D-240`
         measured the anonymous name run's automatic minimum through this property: `nowrap` clamped it to its whole
         max-content width (`117.78px`) and `normal` let it fall to min-content (`65.66px`), which at a `249px` window
         made it wrap to `Provident-` over `Electron` inside the `35px` strip. **THE DECLARATION IS REMOVED WITH ITS
         SUBJECT** (the user's ruling: *"make the name an element so it can truncate"*): the bar computes the initial
         `normal` by inheritance, no text run stands directly in it, and the ONE text-bearing flex item it holds is
         `#app-name` below, which declares its own `nowrap` and truncates.
         **AND `overflow: hidden` IS KEPT FOR WHAT IT IS WORTH, WHICH IS CLIPPING AND NOT SHRINKING.** `D-240` measured
         that it does NOT reach an anonymous run (the name stayed at `117.78px` and the `+` stayed at `154..178`, outside
         the `136px` free area). It is kept because the residual it states still stands: the bar's `24px` padding plus its
         two `0.75rem` gaps plus the `+`'s `1.5rem` are `72px`, so below about `126px` of free area — roughly a `238px`
         window — the row has nothing left to give and something must be clipped rather than painted under the platform's
         controls. A clip is the honest failure: it cannot hide a control the user needs, and `#app-name`'s own ellipsis
         happens long before this clip is reached. */
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid #d8dde3;
      color: #1b2430;
      font-size: 0.85rem;
      gap: 0.75rem;
    }
    /* ═══ **THE BAR'S PAINT IS CARRIED ACROSS THE PLATFORM'S CONTROL STRIP — AND `D-240`'s WIDTH IS UNMOVED.** ═══
       THE REPORT, VERBATIM: *"there is a break where the window control buttons have a different box than the rest of the
       top-bar, and break some of the lines"*. **THE CAUSE IS `D-240`'s OWN FIX**: `.top-bar` is `width:
       env(titlebar-area-width, 100%)`, which ENDS where the free area ends — so the bar's fill and its `border-bottom` stop
       at that edge while the platform draws its three buttons in a native strip of its own to the right of it.
       **THE DIFFERENCE WAS MEASURED OFF THE SCREEN (`import -window`, both themes) AND IT IS BOTH THE FILL AND THE BORDER**:
       the strip is the overlay's own `color` for `32px` and then the PAGE's ground — `#f4f6f8` light, `#12161c` dark — for
       the last `4px`, because `getTitlebarAreaRect()` answers `[0, 0, 908, 32]` while the bar is `36px` tall; and not one
       pixel of the bar's `#d8dde3` / `#2c3642` edge crosses it. So the buttons read as a box of their own with a broken line
       under it.
       **WHAT THIS RULE DOES, AND WHAT IT DELIBERATELY DOES NOT DO**: the box it paints is the HOST's (`#app`,
       `position: fixed; inset: 0`), placed to the RIGHT of the very figure the bar's own width is — so it covers exactly
       the strip and no pixel of the bar — and `.top-bar` keeps `width: env(...)` and its `box-sizing` untouched. The bar
       does NOT reclaim the strip: `D-240` measured the chips running under the buttons when it did. Its `background` is the
       bar's fill and its `border-bottom` is the bar's edge, so the `4px` the platform leaves short are filled and the line
       runs the window's whole width. `box-sizing: border-box` puts that border on the same pixel row the bar's own edge
       occupies (`35…36` — measured), and `height` is the bar's authored `flex: 0 0 36px` (`demo-envelope.ts`'s
       `topBarStyle`) TRANSCRIBED WITH ITS REASON — the same debt `D-247` named for the overlay's colour pair: the platform's
       strip is `32px`, the bar is `36px`, and only the page can paint the difference where the platform does not.
       `pointer-events: none` keeps a 1px line from eating a press, and where `env()` does not resolve the `100%` fallback
       collapses this box to nothing — the bar's own edge is then the whole line, exactly as before. */
    #app::before {
      content: '';
      position: absolute;
      top: 0;
      left: env(titlebar-area-width, 100%);
      right: 0;
      height: 36px;
      box-sizing: border-box;
      background: #fff;
      border-bottom: 1px solid #d8dde3;
      pointer-events: none;
    }
    /* **THE NAME — `#app-name`, THE AUTHORED NODE THE BAR'S TEXT RUN BECAME — AND THE FOUR DECLARATIONS ARE THE WHOLE
       POINT OF THE RULING.** *"Make the name an element so it can truncate"*: a text run is an anonymous flex item, so no
       selector reaches it and neither its `overflow` nor its `min-width` is writable — `D-240` measured the bar-level
       levers dead and the ellipsis DEAD for exactly that reason. Here they land on an element: `overflow: hidden` gives
       the box a clipping box of its own (without it `text-overflow` paints nothing), `text-overflow: ellipsis` cuts the
       glyph run with `…` in that box, `white-space: nowrap` keeps the name on ONE line, and `min-width: 0` drops the
       flex item's automatic minimum so the box may shrink below its content width at all. `flex: 0 1 auto` is the pair
       that decides WHO yields: grow `0` so the name never grows into the row's ground, basis `auto` so it starts at its
       own width, shrink `1` so it is the first box asked to give way — the row beside it keeps `flex: 1 1 auto` and its
       own `overflow-x: auto`, and the `+` keeps `flex: 0 0 auto`.
       **IT AUTHORS NO `css.style` IN THE ENVELOPE** (`APP_NAME_ID`): the node carries its id and its string, and every
       declaration here is presentation — the division `.top-bar` and `.tab-row` already keep. **AND IT DECLARES NO
       `-webkit-app-region`**: the bar's `drag` owns every pixel its children do not claim, so a `no-drag` here would be a
       hole in the window's own handle, and the name is not a control. */
    #app-name {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #tab-rows { display: flex; align-items: center; gap: 0.375rem; height: 100%; overflow-x: auto; overflow-y: hidden; flex: 1 1 auto; min-width: 0; }
    .tab-row {
      /* THE CHIP DOES NOT YIELD (see `#tab-rows` above): the row scrolls, a chip keeps its label's own width. */
      flex: 0 0 auto;
      padding: 0.2rem 0.6rem;
      border: 1px solid #d8dde3;
      border-radius: 6px;
      background: #f4f6f8;
      color: #1b2430;
      font-size: 0.8rem;
      line-height: 1.3;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .tab-row:hover { background: #e8edf4; border-color: #b9c2cc; }
    .tab-row[active="true"] { background: #1b2430; border-color: #1b2430; color: #ffffff; }

    /* THE ADD-A-TAB CONTROL — `#tab-add`, THE AUTHORED NODE BESIDE THE ROW SET (`TABS_ADD_ID`,
       `src/shared/demo-envelope.ts`). ITS LOOK IS THIS SHEET'S AND ITS NODE IS THE GRAPH'S: the envelope authors the id,
       the `+` label, the `no-drag` and `flex: 0 0 auto`, and nothing else; the width, height, box, colour and cursor are
       here, the same division `.tab-row` already has. **IT IS SIZED TO THE BAR AND NOT BY ITS GLYPH** — a one-character
       label with no padding is a 6px press target, which is not a control a person can find, let alone hit.
       **AND IT IS A CHIP'S PEER AND NOT A CHIP**: the same border, radius, background and type as `.tab-row`, so it reads
       as part of the row set — and it takes its dark line in the SAME pair `.tab-row` does, which is the correction the
       reported defect forced: this rule used to say the `+` and the chip took NO line because *"the bar keeps its own light
       background in both arms"*, and that was the bug stated as a reason — a white bar under a `#12161c` page with the
       name and the chips in dark text is the illegible strip the screenshot showed. The bar, the name, the chips and the
       `+` are ONE surface and now carry ONE pair (`body:has([theme="dark"])` below).
       `flex: 0 0 auto` is NOT restated here — the envelope's `tabAddStyle` carries it, and the inline declaration wins. */
    #tab-add {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 0.4rem;
      border: 1px solid #d8dde3;
      border-radius: 6px;
      background: #f4f6f8;
      color: #1b2430;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    #tab-add:hover { background: #e8edf4; border-color: #b9c2cc; }

    /* THE PLACEMENT'S DEFINITION ROOT — HIDDEN BY ITS ID, AND THE ID IS THE WHOLE POINT. `src/shared/demo-envelope.ts`
       authors a def-root `component` node as the row PROTOTYPE (`TABS_ROW_PROTOTYPE_ID`), and the engine renders it as an
       ordinary NODE: it reaches the rendered markup as an EMPTY chip-shaped `div` at `template.root`'s end, after the
       overlay layer. It is the MINT'S OPERAND and never a row, so it must NOT be visible — and before `.tab-row` above
       gave it a chip's shape that empty `div` was merely invisible, which is how it went unnoticed.
       THE RULE KEYS ON THE ID AND NOT THE CLASS, AND THAT IS LOAD-BEARING: the prototype alone renders with `id="tab-row"`
       (from its `props.id`), while every MINTED row carries the `tab-row` CLASS and an AUTO-GENERATED id
       (`preempt-node-node-172`, …). THE TRAP THIS AVOIDS: the mint COPIES a row's `css` off this prototype
       (`src/shared/demo-envelope.ts:198`, the def-root `defRootPrototypeFor` answers), so a `display: none` authored on
       the PROTOTYPE's own `css` would be copied onto EVERY minted row and hide the entire row set with it. Keyed on
       `#tab-row`, the rule hides the definition root and nothing else. The empty node STAYS in the markup — hidden by
       CSS, never deleted — because the mint resolves it by name on every load. */
    #tab-row { display: none; }

    /* THE FOUR MENUS ARE DROP-DOWNS, AND THE WHOLE MECHANISM IS `:focus-within` — NO STATE, NO TOGGLE, NO JS.
       `src/shared/demo-envelope.ts` authors four `.menus-menu` nodes holding eighteen `.menu-item` nodes, and each menu
       node now carries `props.tabindex: '0'` — the paint writes `props.*` as attributes, so the served markup carries
       `tabindex="0"` on the four names. THAT IS THE "CLICK": a click focuses a menu, a click elsewhere blurs it, and
       `:focus-within` reports exactly that, so only the four NAMES show until one is clicked and only one menu can be open
       at a time (focus is single). `Tab` reaches the same four boxes, so a keyboard user gets the drop-down too — a `div`
       with `tabindex="0"` is the honest control here; there is no authored element to hand a `<button>` role to, and
       `AGENTS.md`'s UI-authority rule forbids this sheet conjuring one.
       **THE HIDING IS CSS AND NEVER DELETION**: `.menus-menu > .menu-item { display: none }` keeps all eighteen items in
       the rendered markup at every moment — `provident.dispatch`, `list_targets`, `get_rendered_html` and `get_markdown`
       see the same eighteen nodes they always did (`AL-6`, `AL-7`), and nothing about a role, a label or a refusal moves.
       **THE ITEMS DROP VERTICALLY AND OUT OF THE FLOW**: an open menu's items are `position: absolute` below their own
       name, so they OVERLAY the content beneath instead of pushing the layout — the pane stands in the `top` zone, and a
       strip that grew by seven rows would move the stage. The stack is placed with NO measurement: each row owns one fixed
       `1.4rem` height and the n-th row is offset by `(n - 1) * 1.4rem`, so `nth-of-type` is the only index needed.
       **AND OUT-OF-FLOW MEANS NOTHING CONTAINS THEM, WHICH IS WHY THE PANEL IS A PSEUDO-ELEMENT** (the measured defect:
       the open `View` menu's seven labels were read off a screenshot rendering straight OVER the landing page's heading
       and cards, because an item carried a white background only as wide as the NAME and no edge, radius, shadow or lane
       of its own — over white cards that is no panel at all). The focused menu's `::before` is the ONE box the stack is
       painted behind; its height is the stack's, authored from the item count, and so is the LABEL LANE (`12rem`), wide
       enough that no label spills past the panel. A `min-width` on the items could not do that job: their containing block
       is the name's 40-odd pixels.
       **AND THE TWO ANCESTORS THAT CLIP ARE RELEASED ONLY WHILE A MENU IS OPEN**: an `overflow-x: auto` box computes its
       OTHER axis to `auto` too, so `#pane-menus`'s and the `top` zone's authored `overflow-x: auto` would clip the
       drop-down to the height of the NAME STRIP. The `:has()` rule below outranks those authored inline declarations
       (`!important` is the only way a sheet may) for exactly as long as a menu is focused, and gives both boxes their
       scrolling back the moment focus leaves. WHETHER THAT MEASURES AS AN OVERLAY IS A LAYOUT CLAIM THIS SHEET CANNOT MAKE
       (`D-178`'s unseeable family): it is reasoned from the cascade, not read off a screenshot.
       **AND THE REFUSED ITEMS ARE MARKED BY THE ATTRIBUTE THE RECORD WRITES, NEVER BY A CLASS**: the seven carry
       `props.disabled: 'true'` (`D-181`'s list: `quit`, `reload`, `forcereload`, `toggledevtools`, `minimize`, `zoom`,
       `close`), which the paint emits as the bare `disabled="true"` attribute and cannot turn into a class — the SAME
       reason `.tab-row[active="true"]` above keys off its painted attribute (`D-230`). So `[disabled="true"]` is the only
       lawful key and it is the one used: the seven read greyed and struck through with a `not-allowed` cursor, and the
       hover state is suppressed on them, so the refusal the route enforces (`D-196`'s admitted set in `main`) is also the
       refusal the surface shows. Colour is left to inherit on both nodes, so the dark pair below needs one line and not
       four. */
    .menus-menu {
      position: relative;
      display: inline-block;
      margin: 0.125rem 0.125rem 0.125rem 0;
      padding: 0.15rem 0.4rem;
      border: 1px solid #d8dde3;
      border-radius: 6px;
      background: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .menu-item {
      padding: 0.1rem 0.4rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-weight: 400;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .menu-item:hover:not([disabled="true"]) { background: #e8edf4; border-color: #b9c2cc; }
    .menu-item[disabled="true"] {
      color: #9aa7b8;
      border-color: #e2e7ed;
      text-decoration: line-through;
      cursor: not-allowed;
    }
    /* CLOSED BY DEFAULT: the NAME is all a menu shows until it is focused. */
    .menus-menu > .menu-item { display: none; }
    /* THE PANEL — ONE BOX FOR THE WHOLE DROPPED STACK, AND IT IS THE FOCUSED MENU'S OWN PSEUDO-ELEMENT.
       **WHY A PSEUDO AND NOT THE CONTAINER'S OWN BACKGROUND**: the open items are individually `position: absolute`
       (the rule below), so NO box contains them — the menu's own padding box is the NAME's, and a background declared on
       it would paint the chip and nothing else. `::before` is a box this sheet may author without touching the graph
       (`AGENTS.md` § "UI authority": a pseudo-element renders no node and no DOM), and it is the ONE box the stack is
       painted behind — background, border, radius, shadow, padding and stacking are declared ONCE here and never
       per item. **A SINGLE PANEL WRAPPER IS NOT EXPRESSIBLE WITH THE NODES THAT EXIST**: the four menus and their
       eighteen items are authored provident data (`src/shared/demo-envelope.ts`) and this sheet adds no markup, so the
       only enclosing node is the menu itself, whose box is the name.
       **SO THE PANEL'S HEIGHT IS THE STACK'S, AUTHORED FROM THE ITEM COUNT** — `n * --menu-row` plus the panel's two
       paddings — which is the same trade the six offset rules below already make for each ROW: the count is a figure
       this sheet states, and a menu that gains or loses an item must move both. The `:has()` ladder beneath the panel
       names every count from `2` to `7` in ascending order (the LAST matching rule wins), so every count the offset
       ladder can stack is also sized exactly; a menu of one item falls through to the base value.
       **AND ITS `z-index` IS WHAT PUTS IT OVER THE STAGE, WHICH IS THE SECOND HALF OF THE DEFECT**: the stage is a LATER
       sibling with no stacking of its own, so an in-flow or z-index-less box would be painted UNDER it. The focused
       menu is `position: relative` (the base rule) and takes `z-index: 30`, which makes it a stacking context — panel
       and items together are lifted above every sibling, the stage included, while a menu is open and never otherwise.
       **THE CLIP RELEASES BELOW ARE STILL NEEDED, AND THEY ARE NOT DUPLICATED HERE**: the panel begins at `top: 100%`
       of the name — below the name strip — and `#pane-menus` (`height: 100%`, `overflow-x: auto`) and the `top` zone
       (`overflow-x: auto`) both clip on the axis their own declaration computes, so the panel and its items would show
       their TOP EDGE ONLY. The existing `:has(.menus-menu:focus-within)` pair on those two boxes is what makes the panel
       visible at all, and it does not care what the opened box paints. */
    .menus-menu:focus-within {
      --menu-row: 1.4rem;         /* ONE ITEM'S ROW HEIGHT — the figure every offset and the panel's height are made of */
      --menu-lane: 12rem;         /* THE LABEL LANE — wider than the longest label, so no label wraps or spills */
      --menu-pad: 0.25rem;        /* the panel's own padding above the first row and below the last */
      --menu-rows: 1;             /* the File menu's ONE row; the ladder below names 2 … 7 */
      z-index: 30;
    }
    .menus-menu:focus-within::before {
      content: '';
      position: absolute;
      left: 0;
      top: 100%;
      width: var(--menu-lane);
      height: calc(var(--menu-rows) * var(--menu-row) + 2 * var(--menu-pad));
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #d8dde3;
      border-radius: 6px;
      box-shadow: 0 0.5rem 1.25rem rgba(27, 36, 48, 0.22);
      z-index: 1;
    }
    /* THE COUNT LADDER — ASCENDING ON PURPOSE, because these selectors are equally specific and the LAST match is the
       one that stands: the tallest count a menu carries is the height the panel gets. */
    .menus-menu:focus-within:has(> .menu-item:nth-child(2)) { --menu-rows: 2; }
    .menus-menu:focus-within:has(> .menu-item:nth-child(3)) { --menu-rows: 3; }
    .menus-menu:focus-within:has(> .menu-item:nth-child(4)) { --menu-rows: 4; }
    .menus-menu:focus-within:has(> .menu-item:nth-child(5)) { --menu-rows: 5; }
    .menus-menu:focus-within:has(> .menu-item:nth-child(6)) { --menu-rows: 6; }
    .menus-menu:focus-within:has(> .menu-item:nth-child(7)) { --menu-rows: 7; }
    /* OPEN: the focused menu's items, one fixed row each, dropped straight below the name and taken OUT of the flow.
       **THE ROW IS A LANE INSIDE THE PANEL AND NOT A BOX OF ITS OWN**: `background` is left undeclared here, so the
       panel's box shows through every row and only a hover or a refusal paints a row's own colour — the look a person
       reads as ONE floating panel rather than seven strips. `left: 1px` and `width: … - 2px` keep the rows inside the
       panel's border, and `line-height` centres each label in its `--menu-row`. */
    .menus-menu:focus-within > .menu-item {
      display: block;
      position: absolute;
      left: 1px;
      top: calc(100% + var(--menu-pad));
      width: calc(var(--menu-lane) - 2px);
      height: var(--menu-row);
      box-sizing: border-box;
      padding: 0 0.5rem;
      line-height: calc(var(--menu-row) - 2px);
      border-radius: 4px;
      z-index: 20;
    }
    .menus-menu:focus-within > .menu-item:nth-of-type(2) { margin-top: var(--menu-row); }
    .menus-menu:focus-within > .menu-item:nth-of-type(3) { margin-top: calc(2 * var(--menu-row)); }
    .menus-menu:focus-within > .menu-item:nth-of-type(4) { margin-top: calc(3 * var(--menu-row)); }
    .menus-menu:focus-within > .menu-item:nth-of-type(5) { margin-top: calc(4 * var(--menu-row)); }
    .menus-menu:focus-within > .menu-item:nth-of-type(6) { margin-top: calc(5 * var(--menu-row)); }
    .menus-menu:focus-within > .menu-item:nth-of-type(7) { margin-top: calc(6 * var(--menu-row)); }
    /* THE CLIP IS RELEASED ONLY WHILE A MENU IS OPEN — the pane and the zone it stands in both scroll their own axis
       (`D-187`) and both would otherwise cut the drop-down off at the name strip's own height. **AND THE ZONE IS WHICHEVER
       ONE THE PANE STANDS IN** (`D-252`): `top`/`bottom` and the two sidebars are the four places it can be, and a sidebar
       panel opens SIDEWAYS into the stage, so `#left`/`#right` must release their own scroll for exactly as long as a name
       holds focus — the same release, one axis over. */
    #pane-menus:has(.menus-menu:focus-within),
    #top:has(.menus-menu:focus-within),
    #bottom:has(.menus-menu:focus-within),
    #left:has(.menus-menu:focus-within),
    #right:has(.menus-menu:focus-within) { overflow: visible !important; }
    /* …AND THE RECEIPT KEEPS WRAPPING: the pane is a `nowrap` strip (so the four names hold ONE line), which would put the
       route's answer on a single scrolled line instead of the box it has always been read in. */
    #menus-receipt { white-space: normal; }

    /* THE MENUS PANE'S HANDLE — THE GRIP IS PRESENTATION AND THE NODE IS THE GRAPH'S. `MENUS_AFFORDANCE_ID`
       (`src/shared/demo-envelope.ts`, the nineteenth published name `'menus-vertical'`) is a real authored node:
       `class="gutter-handle"`, `axis="menus-vertical"`, `#pane-menus`'s FIRST child, and its inline `css` already
       carries the two things the design measured — `cursor: col-resize` and the strip's `14px` thickness on the axis the
       strip spans. IT HAD NO RULE HERE AT ALL, WHICH IS THE DEFECT: `14px` wide, and with no `content` and no height, ZERO
       TALL — so the pane's reposition handle existed and a person could not see it, let alone find it.
       **THE DEFECT'S CAUSE IS THE PANE'S FLOW, NOT THE NODE'S MISSING LOOK**: `#pane-menus`'s authored `css` is
       `height: 100%; overflow-x: auto` and nothing else, so the pane is a BLOCK COLUMN and its content is its block lines —
       the four menu boxes are ONE horizontal line of inline-level boxes (`white-space: nowrap` below is what holds them
       on that line, and the box that scrolls a strip wider than the painted width). A strip inside that column that
       carried a height would push every menu below itself, and a strip that carried none is the invisible one that
       shipped — so the strip is TAKEN OUT OF THE LINE (`float: right`, and `position: sticky` on top of it) and given the
       pane's OWN height, which leaves the pane's own flow exactly as the record paints it. The pane's `padding-right`
       reserves the strip's lane, so the menus sit beside the grip instead of under it; **THE LANE IS CUT FROM THE PANE'S
       PADDING AND NEVER FROM ITS CONTENT** — the rule below states `box-sizing: content-box` for exactly that reason, so
       the figure the record states is the content's own and the two handles spend none of it.
       **AND THE SECOND DEFECT WAS THE SAME CLASS, UNSEEN: THE GRIP STOOD INSIDE THE SCROLLER** (the user's report
       *"The drag handle moves with the scrollbar, it should be external"*). The pane carries the painted `overflow-x: auto`
       (`D-243`) because it *"scrolls the axis it adjusts"*, and every descendant of a scroll container is translated by its
       `scrollLeft` — absolutes included, because the containing block moves with the content. Measured on a real window:
       the strip read `[84,36,14,125]` unscrolled and `[-12,36,14,125]` at `scrollLeft 96`, i.e. it travelled with the very
       content it must stay beside. **`D-244` IS THE RULE AND THIS IS ITS SECOND FORM**: a control inside a box the record
       can make a scroller cannot stay put — and here the strip cannot LEAVE the box either, for two measured reasons:
       `AL-1` (gating, `tests/e2e/`, never marked) requires the handle's markup to stand *between* `#pane-menus`'s opening
       tag and the first `class="menus-menu"`, and the authored-object census is pinned at `79` (`theme-control`'s `X-1`),
       so neither moving the node into the zone nor authoring a second box to scroll inside the pane is open to a pass
       like this one. **SO THE STRIP STOPS BEING SCROLLED AND STARTS BEING PINNED**: `position: sticky` with a `left` inset
       taken from the pane itself — `calc(100% + 1.125rem - 0.875rem)` is the pane's CONTENT width (a percentage of its own
       containing block, so the record's painted figure), plus the `padding-right` lane this sheet already reserves, less
       the strip's authored `14px` thickness: THE PANE'S RIGHT EDGE, spelled as the two declarations it is made of and
       never as a figure of this sheet's. MEASURED, the same reading at three scroll positions: `[86,36,14,125]` at
       `scrollLeft 0`, at the mid point and at the end — the strip does not move — while the pane's `scrollWidth` stays
       `196` over a `100` client width, so the menus still scroll UNDER it. **AND IT FOLLOWS THE PANE'S EDGE LIVE BECAUSE
       THE INSET IS A PERCENTAGE**: a drag that previews the pane's width moves the box, the percentage is recomputed from
       the new width, and the strip travels with the painted edge — and therefore with the pointer, which is the whole
       point of standing on the edge the width moves. **THE FLOAT IS WHAT MAKES IT A STRIP AND NOT A LINE**: a floated box
       takes no line of its own (an in-flow block would push every menu below itself, the defect this rule was written
       for), and a float CAN be `sticky`, which an absolutely positioned box cannot. **NOTHING ELSE MOVES**: the pane's
       `padding-right` still reserves the lane, the strip's thickness stays the authored `14px`, its cursor the authored
       `col-resize`, and no rule here states a width, a pane dimension or a figure of the record's.
       **AND THE LANE IS ON THE RIGHT, WHICH IS THE EDGE THE WIDTH ACTUALLY MOVES.** The pane is LEFT-ANCHORED — the top
       zone's first child at its own painted width — so a grip on its LEFT edge stands on the anchor and can never travel
       with the pointer that resizes it: the width would change while the grip stayed, and a press on the anchor has
       almost no room to grow (`D-245` measured that box at `[2,36,14,125]`, `2px` from the window's edge). The handle
       therefore stands on the pane's RIGHT edge, where the pointer, the grip and the painted edge are one point, and a
       rightward drag grows the width (`renderer.ts`'s `PANE_DRAG_HANDLES`, `sign: 1`; `demo-envelope.ts`'s
       `menusHandleStyle` carries the same reason). **THE NODE'S MARKUP POSITION DOES NOT MOVE** — it stays the pane's
       FIRST child, which is the order `AL-1` asserts; only its BOX is taken out of the line, and it is pinned rather than
       carried.
       **THE GRIP ITSELF IS THREE THINGS AND NO FIGURE**: a background, a dotted repeat (`currentColor`, so the dark pair
       below moves one colour and not the pattern), and an inset line — plus a hover state, because a blank strip is
       exactly what nobody finds. `flex: 0 0 auto` is carried as the belt the design named even though it is INERT HERE
       (the pane is a block, not a flex container): the float and the pin are what actually hold the strip unsquashed, and
       the strip's thickness stays the inline `14px`, which no rule below restates.
       **AND THE BOX IS SCOPED BY ID BECAUSE THE CLASS IS SHARED**: `gutter-handle` is the SHARED styling hook of TWO
       authored nodes — this strip and `#gutter-horizontal`, the gutter card's own, which is a flex item of `#gutter-pane`
       (`display: flex`) carrying its placement in its OWN inline `css` (`height: 14px`, `align-self: flex-start`,
       `margin-left: auto`). A `float` or a `position` declared on the CLASS would take that strip out of its row and pin it
       to a float's own line or to the window — so the `top`/`bottom` form's BOX declarations stand on `#menus-vertical` and
       only the PAINT is the class's; the paint costs the sibling nothing and makes both strips findable.
       **AND THE SIDEBAR'S FORM IS THE CLASS's, FOR THE OTHER REASON** (`D-253`; keyed on the inherited class since `D-265`):
       there the strip is on the pane's BOTTOM edge in whichever zone the pane STANDS in, so the rule that states it matches
       `.pane-in-left > .gutter-handle` / `.pane-in-right > .gutter-handle` and covers every pane that consumes the zone's
       form — the class is the one hook every pane's strip already carries, plus the position the engine resolved, and the
       `top`/`bottom` arm keeps the id-keyed box this block is about.
       **AND `-webkit-app-region` IS DELIBERATELY NOT DECLARED ON IT**: the drag region is the top-bar's alone, and this
       strip is NOT inside it — the menus pane stands in the `top` ZONE, below the bar — so a `no-drag` here would guard
       against a region the compositor never had. The click-drag this strip must keep is the pane's own resize gesture,
       which no `drag` region above it can steal. */
    /* **`position` IS DELIBERATELY ABSENT**: it stood here only to be the containing block of the absolutely placed
       grip, and the strip is a PINNED FLOAT now (see the block above) — a declaration whose reason has gone is a claim
       nothing keeps. Nothing else in this pane is positioned against it: each `.menus-menu` is `position: relative` for
       its own drop-down.
       **AND THE FIGURE NOW DESCRIBES THE PANE'S CONTENT BOX, WITH BOTH HANDLES STANDING OUTSIDE IT.** The defect, measured
       on a real window at the pane's own MAXIMUM width (`DEFAULT_PANE_BOUNDS`' `max`, `200`): the node painted
       `width: 200px` and served `clientWidth 200` against `scrollWidth 210` — a HORIZONTAL SCROLLBAR AT THE WIDEST THE
       PANE CAN BE — because under `border-box` the strip's `1.125rem` lane and the move grip's own `14px` float were spent
       out of the figure, so the menus got `184px` of content for a line that needs `210`. `D-246` had to PIN the strip
       because the pane scrolls, and this must not undo that: the pin is untouched (`float: right; position: sticky` with an
       inset built from the pane's content width), and so is the grip's `float: left` pin. What moves is only WHICH BOX the
       two lanes are cut from — the padding, outside the figure, instead of the content inside it — so the record's own
       figure buys the menus their full width and the scrollbar is gone at `200` (`clientWidth 232` = `200 + 14 + 18` over
       `scrollWidth 232`). NOTHING OF THE RECORD'S IS RESTATED: the painted `width` is still
       `['panes','pane-menus','width']` and the drag still writes it; `box-sizing` spends no figure and states no preference. */
    :where(#pane-menus) { box-sizing: content-box; padding-left: 0.875rem; padding-right: 1.125rem; white-space: nowrap; }
    /* **THE MOVE GRIP'S LANE IS THE LEFT PADDING, AND THE NEGATIVE MARGIN IS WHAT PUTS IT THERE**: the grip is a `float:
       left` in the pane's flow (`D-248`), so without this its own `14px` would narrow the menus' line by exactly that much
       — the second handle spending part of the box the painted figure describes. Pulled `0.875rem` left it overhangs into
       the lane the padding above reserves, the content starts at its own origin, and the strip stays pinned to the pane's
       left edge (`position: sticky; left: 0`, authored on the node) where `D-248` measured it at `[0,36,14,14]`. */
    /* ══ **EVERY `top`/`bottom` RULE IN THIS PANE'S BLOCK DECLARES NO SPECIFICITY, BECAUSE THE PANE'S FORM IS KEYED ON ITS
       PUBLISHED `zone` AND NEVER ON ITS ID** ══ The box model above is `:where()`'d for that reason, and so is the grip's
       lane and the strip's pin below: a rule that names an ID outranks any `.pane-in-left`/`.pane-in-right` selector on the
       same node by the cascade's FIRST column, so an id-keyed lane would survive a pane that has left the `top` form.
       **MEASURED, BY PUTTING THE ID RULES BACK AND MOVING ALL THREE PANES INTO `left`**: `pane-menus` and `pane-inspector`
       kept `box-sizing: content-box` and `padding 14px/18px` and stood `152px` wide against a `120px` rail, and their
       strips read `[14, 290, 105, 100]`, while under `:where()` the same three panes read `border-box`, `padding 0` and
       `120`/`105`/`120` wide (the `105` is the menus pane's scrollbar lane). `:where()` takes nothing away from this form:
       these declarations have no competitor in the `top`/`bottom` arm, so their used values are the ones `D-246`/`D-248`
       measured. */
    :where(#pane-menus > #menus-grab) { margin-left: -0.875rem; }
    :where(#menus-vertical) {
      float: right;
      /* ══ **AND IT IS THE TOPMOST THING AT ITS OWN BOX — WHICH IS A RANK, AND IT HAD NONE** ══ The user's report,
         verbatim: *"Resize handle should be over the pane contents instead of under"*. **THE STRIP WAS BEHIND THE
         CONTENT, AND THE CAUSE IS THE FIRST OF THE TWO AND NOT `D-260`'s**: the strip IS positioned (`position: sticky`),
         so it is painted in the positioned band — but its `z-index` was `auto`, and among positioned siblings that band's
         order is DOCUMENT ORDER, while the four `.menus-menu` chips are `position: relative` (also `auto`) and stand
         AFTER it in the tree. **AND THE PANE CREATES NO STACKING CONTEXT FOR ANYTHING TO BE TRAPPED IN**, measured on
         the real window rather than reasoned: `#pane-menus` computes `position: static`, `z-index: auto`, `opacity: 1`,
         `transform: none`, `isolation: auto`, and so does every ancestor up to `#app` (`position: fixed`) — so the strip
         and the chips were ranked in ONE context and the later box won. **MEASURED, and this is why the picture and a
         centre-only probe disagree**: a `9 × 5` scan of the strip's own box answered a `.menus-menu` chip at `9/45`
         points — its ENTIRE TOP BAND, top-centre (`125,39`) included — while `elementFromPoint` at its mid-centre
         answered the strip, so a read that took only the centre would have passed. `z-index: 1` is the RANK: a positive
         value is above every `auto`/`0` positioned box and above all in-flow content in that context, so the strip is
         topmost at its own box while the menus scroll UNDER it — which is the whole point of `D-246`'s pin, and a pin
         painted under what it pins over is a control a person cannot see or press. **IT MOVES NOTHING**: the box is still
         the authored `14px`, the pin is `D-246`'s byte for byte, and a rank is no figure the record owns. **AND THE ONE
         BOX THAT STILL STANDS ABOVE IT IS NAMED RATHER THAN LEFT TO BE FOUND**: an OPEN menu's panel and items carry
         `z-index: 30` (`:focus-within`), so a focused name paints over the strip's top band for as long as it holds
         focus — the sheet's one transient overlay, closed when focus leaves (`D-260`'s reveal arm, the same trade). */
      z-index: 1;
      position: sticky;                       /* a FLOAT can be sticky; an absolutely positioned box cannot (`D-244`'s class) */
      /* THE PIN AND THE STATIC POSITION ARE THE SAME POINT, AND THAT IS NOT REDUNDANT: `left` is what holds the strip
         still while the menus scroll, and `margin-right` is where the strip SITS once the sticky rectangle empties at the
         end of the scroll range — measured apart, the pin alone dropped the strip `86 → 68` at `scrollLeft 96`, and the
         two read `[86,36,14,125]` at EVERY position (`0`, `10`, `48`, `80`, `96`) together. */
      left: calc(100% + 1.125rem - 0.875rem); /* the pane's content width + its padding lane, less the strip's own thickness */
      margin-right: -1.125rem;                /* …and the lane is where its static box lands: the pane's padding edge */
      height: 100%;
      flex: 0 0 auto;
    }
    /* ══ THE SECOND PANE SHARES THE FIRST ONE'S LANES, BECAUSE THE LANES ARE THE GRIP'S AND THE STRIP'S AND NOT A PANE'S ══
       The user's second change: *"Add additional demo panes so that this can be tested with pane rearrangement in a zone"*.
       `src/shared/demo-envelope.ts` authors `#pane-inspector` as the `top` zone's SECOND pane, and it carries THE SAME TWO
       AFFORDANCES in the same order — a `.pane-grab` grip and a `14px` resize strip — so it owes the same three rules: the
       content-box figure with both lanes in the padding, the grip's negative inset out of the menus'-line lane, and the
       strip's float-and-pin. **THE SELECTORS NAME BOTH PANES RATHER THAN REPEATING THE NUMBERS**, so the `0.875rem` and
       `1.125rem` above have ONE spelling in this sheet and a third pane would join the same lists. Nothing here states a
       figure the record owns: the widths are the GRIP's `14px` and the strips' lanes, and the pane's own width is
       `['panes', <id>, 'width']` written by the paint (`D-243`, `D-253`). */
    :where(#pane-inspector) { box-sizing: content-box; padding-left: 0.875rem; padding-right: 1.125rem; white-space: nowrap; }
    :where(#pane-inspector > #inspector-grab) { margin-left: -0.875rem; }
    :where(#inspector-vertical) {
      float: right;
      position: sticky;
      /* THE SAME RANK AS THE MENUS STRIP'S, FOR THE SAME REASON AND NOT FOR SYMMETRY: this pane's own content is `No
         selection` (`D-259`), short enough to stop before the strip's box — measured at `45/45` self-answering points —
         so its strip reads topmost TODAY by the LENGTH OF ITS CONTENT rather than by a rule, and a longer body (or a
         scroll) would put a `.menus-menu`-style `position: relative` box over it exactly as `#menus-vertical`'s was
         measured to be. One rank, both strips: nothing here is a figure of the record's and no box moves. */
      z-index: 1;
      left: calc(100% + 1.125rem - 0.875rem);
      margin-right: -1.125rem;
      height: 100%;
      flex: 0 0 auto;
    }
    /* ══ **"REARRANGEMENT IN A ZONE", DEFINED — AND IT IS A PROVISIONAL ANSWER, WHICH IS SAID HERE RATHER THAN IMPLIED** ══
       The design corpus has NEVER defined what two panes in one zone do (no row, no page and no charter sentence states an
       arrangement; `C-8`'s `zone` member is declarative and names a destination, not a slot), and the user's second change
       is the first thing that makes the question askable. **THE SMALLEST ARRANGEMENT THAT MAKES THE DEMO TESTABLE IS TAKEN,
       AND IT IS PROVISIONAL — owed to L1/L2 as a design question rather than settled by a stylesheet.**
       **WHAT IT IS**: the panes in one zone are laid out ALONG THE PANE-ADJUSTABLE AXIS, each at its OWN stored figure,
       sharing the zone's FIXED axis. `D-243`'s rule is that a pane fills the axis its zone fixes and adjusts the
       orthogonal one — so in a `top`/`bottom` zone the adjustable axis is the WIDTH and the panes stand side by side in a
       ROW, while in a `left`/`right` zone it is the HEIGHT and they stack in a COLUMN. **This is the resolution of the
       contradiction the charter would otherwise leave**: two panes in a `left` zone cannot both be `width: 100%` of it,
       and they do not need to be — the zone's fixed axis is the one thing they SHARE (both fill it), while each keeps its
       own member on the axis the zone leaves free. `flex: 0 0 auto` is what makes the stored figure the BASIS: it fixes
       the main size to the painted `width`/`height` and forbids both the grow and the shrink that would silently
       redistribute the figures a person set.
       **AND IT COSTS NO AUTHORED DECLARATION ON THE ZONE**: the paint replaces a zone's whole `css.style` (`D-234`,
       `D-240`), so a `display` authored on the zone node would be gone after the first delivery — the arrangement must live
       where the paint cannot reach it, which is here. The zone's own `overflow` (`overflow-x: auto` in a `top` zone,
       `D-243`) is what scrolls a row wider than the window.
       **AND THE ORDER WITHIN THE ROW (OR THE COLUMN) IS THE RECORD'S, WITH THE TREE AS ITS INSTRUMENT** — this sheet
       states the AXIS and the BASIS and nothing about sequence, because sequence is now a fact of the `panes` family: each
       pane's `index` is its place among the declared panes, the panes of one zone are read in that order, and
       `renderer.ts`'s arrangement turn makes the zone's child order agree with it through the engine's own `move` op
       (`D-252`'s op, which appends — so the turn appends the panes whose place moved, in order, and the anchor order is
       the sequence). **A `flex` `order` declaration here would have been the SECOND AUTHORITY `D-129` refuses**: the
       record is the order's only writer, the sheet cannot read a record, and a rule keyed on an `index` attribute would
       need the paint to publish one. **THE ONE THING THIS SHEET STILL OWNS IS THAT THE ROW READS LEFT-TO-RIGHT**: a
       child sequence is a visual sequence only because the container is `row`/`column` rather than a reversed one. */
    #top, #bottom { display: flex; flex-direction: row; align-items: stretch; }
    #left, #right { display: flex; flex-direction: column; align-items: stretch; }
    #top > *, #bottom > *, #left > *, #right > * { flex: 0 0 auto; }
    /* ══ IN A SIDEBAR THE PANE'S AXES FLIP, AND SO DOES EVERYTHING THAT STANDS ON THEM — FOR **EVERY** PANE, AND WITHOUT
       NAMING ONE ══════════════════════════════════════════════════════════════════════════════════════════════════════
       `D-243`'s rule is that a pane FILLS the axis its zone fixes and ADJUSTS the orthogonal one, and `D-252` moves the
       pane into the zone its record names — so in `left`/`right` the pane adjusts its HEIGHT, and three authored truths
       that were written for the `top`/`bottom` form stop being true at the same instant. **THE KEY IS A CLASS THE PANE
       INHERITS FROM THE ZONE IT STANDS UNDER, AND NOTHING WRITES IT** (`D-265`): `src/shared/demo-envelope.ts` gives each
       zone a `component` value — `pane-in-top`, `pane-in-bottom`, `pane-in-left`, `pane-in-right`, and the app root the
       stage's `pane-in-stage` — and gives each pane a `component` consumer of `css.classes`, so the engine resolves the
       nearest providing ancestor and APPENDS that class to the pane's own (`fitReference` by tree position, `applyDerived`).
       **THE FOUR CLASS NAMES ARE SPELLED TWICE — ONCE AS THE ENVELOPE'S VALUES AND ONCE HERE AS THE SELECTORS — AND THE
       EQUALITY IS MEASURED RATHER THAN DERIVED** (`D-41`: two literals in two modules, each with its own reason).
       **THIS BLOCK USED TO KEY ON A PAINTED `zone` ATTRIBUTE** (`props.zone`, written by `renderer.ts`'s pane arm on every
       delivery beside the style) **AND THAT MEMBER IS DELETED**: the position is now a fact the engine derives from where
       the node stands, so there is no second copy of the zone in this sheet, none inferred from a box, and nothing that a
       delivery could leave stale — a pane re-parented into `left` wears `pane-in-left` on the very render that moves it,
       MID-DRAG and with nothing written.
       **AND THE SELECTORS NAME NO PANE — THEY NAME THE INHERITED CLASS, AND THAT IS WHY A FOURTH PANE NEEDS NO EDIT HERE.**
       These rules stood on `#pane-menus` and, in compact form, on `#pane-inspector`: two spellings of one form, keyed on
       the panes the demo happened to author, so the THIRD pane — `#gutter-pane`, the stage's, whose record key is
       `['panes','pane-a']` — had NO sidebar form at all (measured: dragged into `left` it computed `display: block;
       flex-direction: row`, its grip stayed `position: relative` with `::after: none`). `D-264` answered that with
       `[zone="left"]:has(> .pane-grab)` and **THIS PASS ANSWERS IT STRUCTURALLY**: every rule below matches
       `.pane-in-left`/`.pane-in-right`, which is a class ONLY A CONSUMING PANE CAN WEAR — so the set of panes that get the
       form is exactly the set the envelope declares consumers for, whatever their ids, and a fourth pane authored with the
       same one-line consumer inherits it with no CSS edit.
       **AND THE `:has(> .pane-grab)` GUARD OF `D-264` IS DELETED WITH ITS REASON, WHICH IS NOT A LOSS — IT IS THE POINT.**
       The guard existed because fourteen nodes carried a `zone` attribute and twelve were DROPS, so the attribute alone
       could not say "this is a pane"; with the class, the DROPS CAN NEVER WEAR IT (they consume no `zone-format` and are
       not under a provider that could reach them as panes) and the structural test the guard supplied is the binding
       itself. Measured before this pass, with the guard struck, the twelve overlays computed `border-box`/`column` — a cost
       the guard paid per-selector; a class the engine resolves pays it once, in the envelope.
       **THE STAGE IS A POSITION AND HAS ITS OWN CLASS** (`pane-in-stage`, provided by the app root): a pane whose record
       names no zone (`C-9`) is under no zone and wears the stage's class, and a pane that leaves a zone SHEDS that zone's
       class in the same render — so the authored `top`/`bottom` form stands again by construction, with no `:not()` and
       nothing remembered.
         (1) THE LANES FOLLOW THE GRIP, AND THE BOX MODEL FOLLOWS THE LANES. The figure the record states is the HEIGHT
             here and the horizontal one is the FILL (`width: 100%`), so the strip's right-hand lane is dropped and the
             pane returns to `border-box`: an 18px lane on the fill's axis would push a `100%` pane past the zone's own
             width and scroll the ZONE, and on the height axis there is no lane to spend at all (the strip is placed by
             the flow below), so the record's figure IS the content's on the axis it now stands for. **THE GRIP's left lane
             went with the grip's move to the head of the pane**: while it stood beside the content a `14px` lane was what
             kept the two from overlapping, and now that it stands ABOVE the content (the header row, below) a lane would be
             width spent on nothing — so `padding-left` is `0` here and the pane's content box is wider by that lane on the
             axis it does NOT adjust. In the `top`/`bottom` form the lane stays exactly as it was: there the grip is a
             `float` in the menus' own line and the lane is the only thing between it and the first name.
         (2) THE GRIP STANDS ON THE PANE'S BOTTOM, the edge the height moves. It cannot be flowed (`D-246`'s class, on the
             other axis): a sidebar pane is a scroller on that axis too (`overflow-y: auto`, `D-243`), so a control in its
             flow travels with the scroll. It takes `D-246`'s own remedy — `position: sticky` against the scrollport's
             BOTTOM edge — and its static position is made that same edge by `order`/`margin-top: auto` in a COLUMN, so
             it is on the bottom edge whether the content overflows or not. `width: auto !important` and `cursor: row-resize
             !important` are the strip's own THICKNESS declaration and its cursor re-read on the axis it now spans: the
             authored `css` carries them inline (`width: 14px`, `cursor: col-resize`), and an inline declaration yields to
             a sheet only with `!important` — the same trade the clip-release rule above already makes. Neither states a
             figure the record owns.
         (3) THE MENUS STACK, AND EACH ONE'S PANEL OPENS TO THE SIDE. A tall narrow column has no room BELOW a name,
             so a drop-down is meaningless there. The STACK costs one declaration (`display: flex; flex-direction:
             column` on the pane blockifies the chips into one row each, at the pane's own width) and the PANEL is
             `D-231`/`D-233`'s mechanism untouched — `:focus-within` on the name, a `::before` box carrying the fill, the
             border and the shadow, and the items `position: absolute` with one `--menu-row` offset each. Only the two
             OFFSETS move: the panel leaves the name's RIGHT edge (`left: 100%`, `top: 0`) instead of its bottom, and its
             items with it — and in the `right` zone both open LEFTWARD (`right: 100%`), because a panel opening right
             from the window's own right column would paint outside the window. The row ladder is unmoved: it is
             `margin-top`, which is the offset a vertical stack needs. */
    .pane-in-left,
    .pane-in-right {
      box-sizing: border-box;              /* the FILL is `width: 100%` here: a content-box plus a lane pushes the pane past the zone */
      padding-left: 0;                     /* the grip's lane goes with the grip: it heads the pane now, it does not flank it */
      padding-right: 0;
      display: flex;
      flex-direction: column;
    }
    /* ══ **EVERY DIRECT CHILD KEEPS ITS OWN FIGURE ON THE COLUMN — `D-253`'s TWO RULES FOR THE MENUS, AS ONE** ══
       A column of stored figures shrinks its children instead of scrolling them, so the chips, the receipt and the two
       affordances all take `flex: 0 0 auto`; the two rules that stood here (`> .menus-menu` and `> #menus-receipt`) said
       it for the only pane that had children to say it about, and the third pane's target gets the same treatment from
       the same line now. No figure of the record's is stated and no box moves. */
    .pane-in-left > *,
    .pane-in-right > * { flex: 0 0 auto; }
    /* ══ THE HEADER ROW: THE GRIP AT THE TOP OF THE PANE, THE PANE'S NAME TO ITS RIGHT ══════════════════════════════════
       The user's report, verbatim: *"In the sidebar, move the grab handle to the top of the pane above the text (not to
       the side), and render the pane name as text to the right of it."* **THE GRIP STOOD BESIDE THE CONTENT AND NOW STANDS
       ABOVE IT, AND THE NAME IT CARRIES IS THE AUTHORED ONE**: `src/shared/demo-envelope.ts` writes `props.name` on this
       node (`'Menus'`, `'Inspector'`, `'Stage'`), which the paint emits as the bare `name="Menus"` attribute this rule
       reads — **NO NEW AUTHORED NODE**, no new record member and no new bridge member. **IT SURVIVES EVERY DELIVERY**,
       which is what the choice turns on: the pane arm writes exactly ONE thing, `css.style` (whole-key), in one
       `state-slice` (`renderer.ts`'s `driveLayoutRegions` → `paintStyle`), so `props` is NEVER replaced whole and an
       authored sibling member cannot be overwritten — and since `D-265` deleted the pane's painted `props.zone` there is
       no `props` write on a pane at all; a relocation is the engine's `move` op and re-authors nothing (`D-252`). A `name` in the `panes` family would have owed the creation repair a value for every
       pane it mints and the placeholder one for every pane a cold profile derives, which is a decision about a pane
       nobody has named.
       **THE PAIR IS ONE FLEX LINE AND THE GRIP IS THE LINE**: the pane is the COLUMN in a sidebar (`display: flex;
       flex-direction: column` above), the grip is its FIRST child in the markup (`AL-1`'s order, unmoved), so a
       `display: flex` on the grip makes its glyph and its `::after` name TWO BOXES ON THAT ROW while every other child flows
       BELOW it. **NO WRAPPER NODE IS OWED AND NO NEW ELEMENT IS AUTHORED**: the name is a PSEUDO-ELEMENT, which renders no
       node and no DOM (`AGENTS.md` § "UI authority"), so the name a person reads is also in the rendered markup as the
       attribute `get_rendered_html` and `get_markdown` already emit — the paint is a VIEW of a member the graph carries.
       `width: auto !important` is what turns the grip's own `14px` box into the ROW (a column flex item stretches), and the
       sheet states it `!important` for the same reason the strip's `width`/`cursor` below do: the authored `width: 14px` is
       INLINE. **THE AUTHORED `float: left` IS LEFT ALONE AND IS INERT HERE**: `float` and `clear` do not apply to a flex
       item, so the stretch is what makes the row span the pane and no second spelling of the box is needed — while the
       `top`/`bottom` form, where the grip is NOT a flex item, keeps that float and its pin byte for byte. **A PANE WITH NO
       NAME RENDERS AN EMPTY NAME AND NOT NO HEADER** — `attr(name)` on an absent attribute is `''`, and the row is the
       GRIP's, which the pane owes whether it has a name or not.
       **AND THE THIRD PANE'S AUTHORED INLINE BOX YIELDS TO THE SAME TWO DECLARATIONS, WHICH IS WHY THEY ARE `!important`**:
       `#gutter-grab` authors `position: relative` and `align-self: flex-start` in its own `css` (`gutterGrabStyle`, the
       card's form: the pane's flow origin, 14px wide), and both would otherwise stand here — an inline declaration is
       beaten by a sheet only with `!important`, and the two consequences are measured rather than argued: a
       `relative` grip scrolls away with the content the pane now scrolls (`D-246`'s reason, third form), and a
       `flex-start` grip shrink-wraps instead of spanning the pane, so the header row would be a chip at the left edge and
       not a row. `align-self: stretch` states what a column flex item's `auto` already resolves to, so the two panes that
       author neither declaration keep the box `D-257` measured, byte for byte.
       **THE ROW COSTS A ROW, BY DESIGN, AND THE LANE IT NO LONGER OWES IS GIVEN BACK.** `D-256` removed a `14px` row
       because the grip spent one BESIDE the content and owed it nothing; a header owes it, so `margin-bottom` is no longer
       cancelled — and the LEFT lane goes the other way, because nothing stands beside the content any more: the pane's
       `padding-left` returns `0.875rem → 0` in `left`/`right` (the lane's own comment, clause (1) above). **MEASURED at
       this sheet's defaults, before → after, in `left`**: the pane's box `120 × 100` UNCHANGED and `clientWidth 105`
       unchanged (the vertical scrollbar is inside it), while the CONTENT box widens `91 → 105` (+14, the returned lane) and
       the content starts `14px` lower — the first menu `[14,192,89,23] → [0,206,103,23]`, the resize strip
       `[14,276,91,14] → [0,276,105,14]`, and the pane's `scrollHeight 124 → 138`. **THE PANE PAYS ONE ROW AND NO LONGER
       PAYS A LANE**: the header is `[0,190,105,14]` — the row's full width, `14px` tall, at the pane's top.
       **AND THE PIN IS `D-246`'S, KEPT**: a sidebar pane scrolls its own axis (`overflow-y: auto`, `D-243`) and every
       descendant of a scroll container travels with it, so the header is `position: sticky; top: 0` — this app PINS its
       controls (the resize strip here, the four zone strips, and this grip's own `top`/`bottom` form), and a header that
       scrolled away would be a control a person has to scroll back to. MEASURED at `scrollTop 0` and at the content's end
       (`38`): the header reads `[0,190,105,14]` at both, while the first menu travels `206 → 168` under it. */
    .pane-in-left > .pane-grab,
    .pane-in-right > .pane-grab {
      flex: 0 0 auto;
      display: flex;                       /* the glyph and the name, ONE line — the row this rule exists for */
      align-items: center;
      justify-content: flex-start;
      gap: 0.25rem;                        /* the gap between the grip and its name, and neither is a figure of the record's */
      width: auto !important;              /* the authored `14px` is the GRIP's box; the row spans the pane's content width */
      align-self: stretch !important;      /* …and the third pane's own `flex-start` must not shrink-wrap the row instead */
      padding: 0 0.25rem;                  /* the row's own inset, so the glyph does not sit on the pane's border */
      position: sticky !important;         /* the third pane authors `relative`; a header may not scroll away (`D-246`) */
      top: 0;                              /* the pin on the axis a sidebar pane scrolls (`D-246`'s class, third form) */
      margin-left: 0;                      /* the `top` form's float lane is not this form's: nothing stands beside the content */
      text-align: left;
    }
    /* **THE NAME, TO THE RIGHT OF THE GLYPH** — one line, the GRIP's own ink (so the dark pair below covers it with no
       second rule and no new colour), never wrapped (the pane is `nowrap`), and never shrunk out of the row. `attr(name)`
       is the whole binding: the value is the envelope's, not this sheet's, and a grip that carries no name paints ''. */
    .pane-in-left > .pane-grab::after,
    .pane-in-right > .pane-grab::after {
      content: attr(name);
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 700;
      line-height: 14px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    /* ══ **THE STRIP IS THE PANE'S BOTTOM EDGE, AND IT IS THE `gutter-handle` EVERY PANE ALREADY CARRIES** ══ A pane's
       resize strip is a `.gutter-handle` node (`#menus-vertical`, `#inspector-vertical`, `#gutter-horizontal`), which is
       the ONE hook all three panes share and the reason this rule needs no pane's name: the class is the envelope's
       (authored, and the paint's, above), the edge is the zone's, and a fourth pane's strip joins the same line. **AND IT
       IS THE SAME FORM FOR ALL THREE BECAUSE IT IS THE SAME EDGE**: the record's figure is the HEIGHT in a sidebar and the
