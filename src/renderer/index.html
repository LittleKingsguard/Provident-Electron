       strip adjusts exactly that, so the strip spans the width, its cursor is `row-resize`, and its static position is the
       pane's bottom (`order: 1` + `margin-top: auto`) with `bottom: 0` holding it there against an overflowing column.
       `align-self: stretch !important` is the third pane's authored `align-self: flex-start` yielding — the same trade the
       grip's row makes and for the same reason — and the two `!important`s beside it are the strip's THICKNESS and cursor
       moving to the height axis over an inline `width: 14px`/`cursor: col-resize`. */
    .pane-in-left > .gutter-handle,
    .pane-in-right > .gutter-handle {
      order: 1;                            /* LAST in the column: its static position is the pane's bottom edge */
      flex: 0 0 auto;
      float: none;                         /* the pin that held it against the RIGHT edge is the height-axis lane's job now */
      position: sticky;
      bottom: 0;                           /* `D-246`'s remedy, on the axis this pane scrolls */
      left: auto;
      /* THE STATIC POSITION AND THE PIN ARE THE SAME EDGE, WHICH IS `D-246`'s OWN TWO-PART SHAPE: `margin-top: auto`
         spends the free space ABOVE the strip when the content is shorter than the pane, so it stands on the bottom edge
         with nothing to scroll, and against an overflowing column the auto margin is `0` and the `bottom: 0` pin is what
         holds it there — measured at `scrollTop 0 / 5 / 10`: `[14,276,91,14]` at every one, its bottom `290` on the
         pane's own bottom `290`.
         **AND IT IS `!important` BECAUSE THE THIRD PANE AUTHORS A `margin-left: auto` OF ITS OWN** (`handleStyle`: the
         card's flex row puts its strip top-RIGHT, and a margin is the only thing there that can). That declaration is
         inline, so only a `!important` reaches it — AND LEAVING IT STANDING IS MEASURED, NOT FEARED: an auto margin on
         the CROSS axis is what `align-self: stretch` cannot override, so the `left` arm read the strip `[120, 276, 0, 14]`
         — a zero-width sliver pinned to the pane's right edge — where the other two panes' strips read `[0, 376, 105, 14]`
         and `[0, 476, 120, 14]`. The shorthand below takes all four sides anyway, so no pane's strip loses a margin it
         had: the two that author none already read `auto 0 0 0`. */
      margin: auto 0 0 0 !important;
      width: auto !important;              /* it spans the pane's width: the authored `14px` is its THICKNESS, now the height */
      height: 14px;
      align-self: stretch !important;      /* …and span it does, even where the node authored `flex-start` for the card */
      cursor: row-resize !important;        /* …and the cursor follows the axis it spans (the authored one is `col-resize`) */
    }
    /* THE PANEL OPENS SIDEWAYS IN A SIDEBAR — keyed on the pane's `zone` and the MENU's own class, which is the content's
       hook and no pane's name: `.menus-menu` occurs only in the menus pane, so this says "in a sidebar, every panel opens
       into the stage" without naming a pane, and `right`'s arm opens LEFTWARD for the reason clause (3) states. */
    .pane-in-left > .menus-menu:focus-within::before {
      left: 100%;
      top: 0;
    }
    .pane-in-left > .menus-menu:focus-within > .menu-item {
      left: calc(100% + var(--menu-pad));
      top: 1px;
    }
    .pane-in-right > .menus-menu:focus-within::before {
      right: 100%;
      left: auto;
      top: 0;
    }
    .pane-in-right > .menus-menu:focus-within > .menu-item {
      right: calc(100% + var(--menu-pad));
      left: auto;
      top: 1px;
    }
    /* ══ **THE SECOND PANE'S OWN SIDEBAR BLOCK IS DELETED WHOLE, AND THE HEADSTONE STANDS HERE RATHER THAN A SILENCE** ══
       (`D-9`: a file must not deny its own body.) `D-253` and `D-257` spelled the sidebar's three truths twice — once for
       `#pane-menus` and once, in compact form, for `#pane-inspector` — because a `[zone]`-leaning selector looked like it
       would also catch the stage's pane, which has no zone and no header form. The block above answers that in the
       SELECTOR (the inherited `.pane-in-left`/`.pane-in-right` class) and states the form ONCE, so the second spelling had nothing left to
       say: every declaration it carried — the `border-box` box model, both lanes `0`, the column, the header row, the
       `attr(name)` label, the strip on the bottom edge with `order: 1` and `margin: auto 0 0 0` — stands above, unchanged
       and for the same reasons. **NOTHING IS LOST AND NOTHING IS RE-SPELLED**: that pane's `D-253`/`D-256`/`D-257`
       readings are the generic rules' readings now. */

    .gutter-handle {
      color: #6f7d90;
      border-radius: 3px;
      background-color: #dfe5ec;
      background-image: radial-gradient(circle at center, currentColor 0.8px, transparent 1px);
      background-size: 4px 6px;
      background-position: center;
      background-repeat: repeat;
      box-shadow: inset 0 0 0 1px #c9d2dc;
      transition: background-color 120ms ease, box-shadow 120ms ease;
    }
    .gutter-handle:hover { background-color: #c3ccd8; box-shadow: inset 0 0 0 1px #8f9dae; }

    /* THE PANE-MOVE GRIP AND ITS FOUR ZONE OVERLAYS — THE MENUS' REVEAL, AND THE DRAG'S TARGETS
       (`docs/L3/renderer-wiring/design-pane-relocation.md` rev 1 §1; `D-244`'s affordance class; the gesture the user
       asked for: *"click-drag into the vicinity of a zone and it shows a preview of the pane's placement, release causes
       it to commit"*). `src/shared/demo-envelope.ts` authors TWO `.pane-grab` grips (`#menus-grab` in the menus pane,
       `#gutter-grab` in the gutter pane), each carrying `props.tabindex: '0'` and four `.pane-drop` children whose `props`
       name the pane and the zone a drag into them means. **THE FORM IS `:focus-within`'s AND THE VISIBILITY IS THE
       GESTURE'S** (correcting `D-248`'s *"the reveal is `:focus-within` and nothing is stored"*, which was true of
       the ARM and false of the gesture): a press focuses a `tabindex="0"` element, so `:focus-within` is what gives the four
       overlays their fill, their border and their label — *"NO STATE, NO TOGGLE AND NO NEW RECORD"*, exactly the four
       menus' rule above — **but FOCUS IS NOT A DRAG**, and a released drag leaves the grip focused, so an arm keyed on
       focus alone leaves four one-word labels standing over the pane (the user's report, measured). So the arm below is
       the CLOSED state — `opacity: 0` and `visibility: hidden`, neither painted nor hit-testable — and `renderer.ts`'s
       press OPENS each drop that has a window, in the same inline transient that carries its box, clearing both on every
       end. THE HIDING IS CSS AND NEVER DELETION, so all twelve drops stay in the markup for `provident.dispatch`,
       `list_targets`, `get_rendered_html` and `get_markdown` while nothing renders them outside a gesture.
       **THE OVERLAYS' BOX IS NOT THIS SHEET'S AND IS NO LONGER THE ENVELOPE'S EITHER — IT IS THE DRAG'S** (the `14px` grip
       thickness, `cursor: grab` and — for the menus pane only — `D-246`'s `float`/`position: sticky` pin are authored there;
       the drops themselves author `position: fixed`, a pointer cursor and `opacity: 0`, and NO extent at all): a zone's
       extent is `['zones', <id>, 'size']`, so `renderer.ts` composes each drop's box from those four figures and the zones'
       order while the grip is pressed (`paneMoveDropBoxOf`) and writes it as the gesture's own inline style. A `position`,
       an `inset` or a dimension here would be a second spelling of a figure the record owns — the drift `D-188` debt 2
       names — and the `25vh`/`20vw` bands the envelope used to carry were that same second authority in viewport units:
       measured on a `230`-wide window, a `20vw` left lane was `50px` against a `115px` left rail, so a drag into the rail
       resolved nothing, while the right lane hung over the `top` zone's own right end. What stands here is the FILL, the
       border, the centred one-word label and the `z-index` that keeps an overlay above the pane it was opened from — and,
       on the overlay the pointer is standing in during a drag, one TRANSIENT inline `background-color` written and cleared
       by `renderer.ts`'s `paneMovePreviewWrite`/`paneMovePreviewClear`, which is the preview's own state and no record's.
       **AND `opacity` IS THE VISIBILITY OF THE WHOLE AFFORDANCE**: the closed `0` below is every drop's state outside a
       gesture, and the drag raises the ONE under the pointer to `1` and keeps its three siblings at `0` — so the four
       windows are never all painted at once (they used to be, and a drag released over no zone left them standing over the
       app, which is exactly the debris the user reported as *"something appears in the right side of the top zone"*).
       **THE AUTHORED `opacity: 0` ON THE ENVELOPE'S DROPS IS NO LONGER THE MECHANISM**: the gesture's clear removes an
       inline property by name and an AUTHORED inline declaration goes with it, which is how four `opacity: 1` labels
       survived a release — a closed state a transient can delete is not a closed state, so it is declared here
       and the transient falls back to it.
       **AND `-webkit-app-region` IS DELIBERATELY NOT DECLARED HERE**: the drag region is the top-bar's alone and both
       grips stand OUTSIDE it — the menus pane in the `top` ZONE below the bar, the gutter pane in the stage's own card
       — so a `no-drag` here would guard against a region the compositor never had, which is the reading
       `#menus-vertical`'s block above already states for its own strip. */
    .pane-grab {
      color: #6f7d90;
      border-radius: 3px;
      background-color: #dfe5ec;
      box-shadow: inset 0 0 0 1px #c9d2dc;
      /* THE GLYPH IS THE AFFORDANCE'S WHOLE LOOK: centred, unselectable, and never wrapped out of its `14px` box. */
      line-height: 14px;
      text-align: center;
      font-size: 11px;
      user-select: none;
      transition: background-color 120ms ease, box-shadow 120ms ease;
      /* ══ **THE GRIP'S OWN RESTING RANK — THE STRIP'S DEFECT ONE CONTROL OVER, AND IT WAS MEASURED, NOT ASSUMED** ══
         The user's report named the resize strip (*"Resize handle should be over the pane contents instead of under"*),
         and the `⠿` grip has the same shape and had the same hole: it is `position: sticky` (a positioned box), so the
         chips — `position: relative`, `z-index: auto`, LATER in the tree — are ranked after it and paint over it the
         moment the menus scroll under it. **MEASURED on the real window, `9 × 5` points of the grip's own box**:
         `#menus-grab` answered ITSELF at `45/45` unscrolled and at `1/45` at the menus pane's `scrollLeft` end (the one
         surviving point is its own edge), and `9/45` in the sidebar arm with the pane scrolled to its `scrollTop` end —
         so the relocation grip, the pane's only way to be moved, became unpressed-by-measurement while the pane was
         scrolled. **THE RANK IS THE SAME ONE THE STRIPS TAKE**, so a grip and a strip are one rule's worth of boxes and
         a future affordance of either kind inherits it; and `:focus-within`'s `4` below still outranks it, which is what
         keeps `D-260`'s four drops — this grip's own children, trapped in this grip's context — exactly as reachable as
         that row measured them. Nothing about the box, the glyph or the drops' closed state moves. */
      z-index: 1;
    }
    .pane-grab:hover, .pane-grab:focus-within { background-color: #c3ccd8; box-shadow: inset 0 0 0 1px #8f9dae; }
    /* ══ THE GRIP IS LIFTED SO ITS OWN FOUR WINDOWS CAN BE HIT — THE OTHER HALF OF THIS PASS, AND THE REASON A DRAG *BACK* TO
       `top` COULD NOT LAND** ══ The grip is `position: sticky` in both forms and a sticky box makes a stacking context, so
       the `z-index: 3` on its drops is CONFINED to that context: against the pane's own positioned content — the four
       `.menus-menu` chips are `position: relative` — the chips are later in the tree and paint ABOVE the overlays however
       large their `z-index` is (measured live: `elementsFromPoint(490,106)` answers `menus-menu` FIRST and
       `menus-grab-top` second). That is invisible while the dragged pane is narrow, and fatal to the user's own direction:
       a pane arriving from a sidebar still carries `width: 100%`, so it spans the whole `top` band and its chips cover
       every point the pointer can stand on there — so the release resolved NO drop, wrote nothing, and the pane stayed
       where the preview had put it. **THE LIFT IS ON THE GRIP AND NOT ON THE DROP** because the drop's own `z-index` is
       trapped inside the grip's context: a declaration on the box that MAKES the context is the only one that can raise
       it. It costs no figure the record owns, changes no geometry, and it is also the right pinning for the sidebar's
       sticky header row (`D-246`'s rule, third form): a pinned control belongs above the content that scrolls under it. */
    .pane-grab:focus-within { z-index: 4; }
    /* THE FOUR ZONES ARE CLOSED UNTIL THE GRIP IS HELD, AND THEN THEY ARE FOUR TRANSLUCENT WINDOWS OVER THE LAYOUT. */
    .pane-grab > .pane-drop { display: none; }
    .pane-grab:focus-within > .pane-drop {
      display: flex;
      align-items: center;
      justify-content: center;
      /* THE CLOSED STATE, AND IT IS THE SHEET'S SO NO CLEAR CAN DELETE IT: invisible AND not under the pointer,
         which are two facts and need both declarations — an `opacity: 0` box still answers `elementFromPoint`, and a box
         with no extent answers it at its static position, so a closed drop would swallow clicks meant for the pane. The
         press writes `visibility: visible` beside the box and removes it on every end. */
      opacity: 0;
      visibility: hidden;
      z-index: 3;
      color: #1b2430;
      background-color: rgba(150, 174, 200, 0.35);
      border: 2px dashed #6f8ba8;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
    }
    .pane-grab > .pane-drop:hover { background-color: rgba(120, 150, 182, 0.5); }
    /* AND THE OVERLAYS GET THEIR DARK PAIR, THE `D-247` RULE: an unpaired light fill under a dark page is a legibility
       bug and not a taste one — and an overlay is the one control a person reads WHILE they drag, so it must read. */
    body:has([theme="dark"]) .pane-grab:focus-within > .pane-drop {
      color: #e8edf4;
      background-color: rgba(60, 82, 108, 0.55);
      border-color: #7d97b4;
    }
    body:has([theme="dark"]) .pane-grab > .pane-drop:hover { background-color: rgba(84, 110, 140, 0.6); }

    /* THE THEME RULES — PRESENTATION KEYED ON THE AUTHORED ATTRIBUTE, AND THE NAME AND VALUES ARE THE DECLARATION'S,
       NOT THIS STYLESHEET'S CHOICE. `src/shared/theme.ts`'s `applyThemeDeclaration` echoes the CALLER-held name that
       `themeWiringRole` in `src/renderer/renderer.ts` holds, and the consumer applies it as `props.<name>` on the
       AUTHORED state node — so the rendered marker is `[theme="dark"]` on that node, a DESCENDANT of the app surface.
       `:has()` is the one way a stylesheet can restyle that node's ANCESTORS, which is what "the toggle restyles the
       window" means; the selector names the ATTRIBUTE and never the envelope's node id, because the attribute is the
       interface the graph publishes and the shell has no business pinning a provident node's spelling.
       The light design is the BASE and needs no rule, so `[theme="light"]` — and the boot, where the attribute does not
       exist at all — falls through to it. Layout, spacing and type are untouched: only colours move, in the proportions
       the light design already uses. The operator panes column is the ISOLATED pane graph's surface, styled by the
       explicit colours below, and the dark pair re-states exactly those so nothing drops to illegible. */
    body:has([theme="dark"]) { background: #12161c; color: #e8edf4; }
    body:has([theme="dark"]) .card { background: #1b222b; border-color: #2c3642; }
    body:has([theme="dark"]) .btn { background: #2b3542; color: #e8edf4; border: 1px solid #3a4654; }
    body:has([theme="dark"]) .counter-value { color: #ffffff; }
    body:has([theme="dark"]) input { background: #10151b; color: #e8edf4; border: 1px solid #2c3642; }
    body:has([theme="dark"]) .echo-out { border-color: #3a4654; }
    body:has([theme="dark"]) .menus-menu { background: #1b222b; border-color: #2c3642; }
    /* THE PANEL HAS ITS OWN DARK LINE, and the rows keep none: their background is the panel's (see the OPEN rule
       above), so the pair moves the PANEL's fill and border and paints a row only where a row has a colour of its own —
       the hover. A row rule here would repaint all eighteen rows over the panel and leave the panel's edge light. */
    body:has([theme="dark"]) .menus-menu:focus-within::before {
      background: #1b222b;
      border-color: #2c3642;
      /* AND ITS SHADOW, WHICH IS THE ONE MEMBER OF THE LIGHT RULE THE PAIR LEFT BEHIND: `rgba(27, 36, 48, 0.22)` is a
         shadow cast ON a light page and reads as a light haze under a dark one, so it deepens to the page's own near-black
         (`#12161c`, at the light arm's own alpha-plus). Nothing else in the rule moves and no second rule for the selector
         stands — one selector, one box. */
      box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.55);
    }
    body:has([theme="dark"]) .menu-item:hover:not([disabled="true"]) { background: #2b3542; border-color: #3a4654; }
    body:has([theme="dark"]) .menu-item[disabled="true"] { color: #5d6b7d; border-color: #2c3642; }
    /* ═══ **THE GRIPS' PAIR, DECLARED ONCE — AND `D-247`'s *"both grips already paired"* WAS ONLY HALF TRUE.** ═══
       THE REPORT, VERBATIM: *"Same for drag handles"* — after the scrollbars — with the grips reading as LIGHT strips
       against a dark pane. **MEASURED, and the two classes are two different stories**: the six `gutter-handle` nodes
       (`#menus-vertical`, `#gutter-horizontal`, the four zone strips) already computed `#2c3642` on `#7d8a9b` ink under
       dark, because the arm below named that class — while the TWO `pane-grab` grips (`#menus-grab`, `#gutter-grab`)
       computed `rgb(223, 229, 236)` = `#dfe5ec` with `#6f7d90` ink and a `#c9d2dc` hairline under dark: **the LIGHT base
       values, byte for byte**, because NO dark arm named that class at all. The only dark rules for it were its four
       `pane-drop` CHILDREN (the overlays, above), so the grip a person actually presses kept a light box on a dark page.
       **THE TWO CLASSES SHARE THE PAINT AND DID NOT SHARE ITS PAIR**: `.gutter-handle` and `.pane-grab` carry the same
       four colours in the light arm (`#6f7d90` ink, `#dfe5ec` fill, `#c9d2dc` inset line, `#c3ccd8`/`#8f9dae` hover) —
       the dot pattern is the only difference — so the pair is stated ONCE and both selectors are named in it, which is
       the same treatment the four menus' names got. **NO NEW FIGURE IS SPENT**: `#2c3642` is the dark pair's border,
       `#3a4654` its strong border, `#7d8a9b` the muted ink the `gutter-handle` arm already used.
       **AND THE HOVER ARM IS NOT DECORATION, IT IS REQUIRED BY SPECIFICITY**: the dark base rule below is
       `body:has([theme="dark"]) .pane-grab` — (0,2,1) — which OUTRANKS the light arm's `.pane-grab:hover` (0,2,0), so a
       grip with no dark hover arm would compute its RESTING colour while hovered. The light hover arm also states a
       `box-shadow` (`#8f9dae`) that would otherwise leak into the dark arm, so the dark hover states both members and
       moves the FILL one step (`#2c3642` → `#3a4654`), exactly as the `gutter-handle` arm always has. */
    body:has([theme="dark"]) .gutter-handle,
    body:has([theme="dark"]) .pane-grab { background-color: #2c3642; color: #7d8a9b; box-shadow: inset 0 0 0 1px #3a4654; }
    body:has([theme="dark"]) .gutter-handle:hover,
    body:has([theme="dark"]) .pane-grab:hover,
    body:has([theme="dark"]) .pane-grab:focus-within { background-color: #3a4654; box-shadow: inset 0 0 0 1px #3a4654; }
    body:has([theme="dark"]) #status,
    body:has([theme="dark"]) #panes .hint,
    body:has([theme="dark"]) #panes #security-status,
    body:has([theme="dark"]) #panes #security-token label { color: #9aa7b8; }

    /* ═══ **THE TOP BAR'S OWN PAIR — THE ONE SURFACE THE DARK ARM HAD MISSED, AND THE REPORTED DEFECT WAS EXACTLY IT.** ═══
       THE REPORT, VERBATIM: *"Dark mode doesn't change the top-bar"* — and the screenshot showed the app `#12161c`
       everywhere with a WHITE strip across the top carrying the name and the chips in dark text. **THAT IS A LEGIBILITY
       BUG AND NOT A TASTE ONE**: the bar is the app's own surface, not the Electron shell's chrome (its three window
       buttons are the platform's and are not in this sheet's reach), and the name, the tab chips, the `+` and the dropdown
       panels that hang off it are all authored provident nodes painted ON it.
       **WHAT WAS PAIRED AND WHAT WAS NOT, READ OFF THIS SHEET RATHER THAN GUESSED.** The pair above covered `body`, the
       `.card`, `.btn`, `.counter-value`, `input`, `.echo-out`, the `.menus-menu` names, the drop-down PANEL
       (`.menus-menu:focus-within::before`, fill AND border), the menu items' hover and refusal arms, the two grips and the
       operator panes' four muted lines — and it did NOT cover one pixel of the bar: `.top-bar`'s `background: #fff`,
       `border-bottom: 1px solid #d8dde3` and `color: #1b2430`, `.tab-row`'s `#f4f6f8`/`#d8dde3`/`#1b2430` with its
       `#e8edf4`/`#b9c2cc` hover and its `#1b2430`+`#ffffff` ACTIVE inversion, `#tab-add`'s identical four, and the panel's
       `box-shadow: … rgba(27, 36, 48, 0.22)`. Each takes its line below.
       **THE CONVENTION IS THE EXISTING ONE, COPIED AND NOT INVENTED**: the light design is the BASE rule and stays exactly
       as it is; the dark arm is `body:has([theme="dark"]) <the light selector verbatim> { … }`, keyed on the ATTRIBUTE the
       paint writes (never the envelope's node id — `[theme="dark"]` is the graph's published interface); ONLY COLOURS move,
       in the proportions the light design already states; and the values are the SAME PALETTE the pair above uses —
       `#1b222b` the raised surface (`.card`, `.menus-menu`), `#2c3642` its border, `#2b3542` the raised-and-inset fill
       (`.btn`, a menu item's hover), `#3a4654` its stronger border, `#e8edf4` the page's own foreground on dark, `#1b222b`
       the ink ON that foreground when the emphasis inverts. No new colour is spent: an arm that needed one would be a
       figure this sheet's design does not have.
       **AND WHAT A DARK BAR SHOULD LOOK LIKE, STATED SO THE PAIR CAN BE READ AS A PICTURE**: the strip is the same panel
       surface the cards and the menu names are (`#1b222b`), its bottom edge is that surface's border (`#2c3642`), and the
       name is the page's own light ink (`#e8edf4`). A chip is one step ABOVE the bar (`#2b3542` fill, `#3a4654` border) so
       the row set reads as controls lying on a strip rather than as holes cut in it, its hover is one step above the chip
       (`#3a4654`), and the ACTIVE chip keeps the light arm's proportion — emphasis by INVERSION — so it is the one light box
       with dark ink (`#e8edf4` on `#1b222b`), exactly as it is the one dark box with light ink on the light bar. The `+`
       is a chip's peer by the rule above, so it moves with the chips and not separately.
       **IT IS THE SHEET'S ONE COLOUR PAIR FOR THIS STRIP AND NOT A SECOND APPEARANCE AUTHORITY**: no element, class,
       attribute or style is created here, the key is the declaration's own attribute, and the light arm is still the base —
       so a realm that renders no `theme` attribute (a boot with no delivery) paints exactly what it painted before. */
    body:has([theme="dark"]) .top-bar { background: #1b222b; border-bottom-color: #2c3642; color: #e8edf4; }
    /* AND THE STRIP'S PAINT TAKES THE SAME PAIR, because it is the bar's continuation and not a second surface: the
       measured dark reading off the screen was the overlay's `#1b222b` for `32px`, the page's `#12161c` for the last
       `4px` and NO edge at all under the buttons. One selector, two colours, and the light arm stays the base. */
    body:has([theme="dark"]) #app::before { background: #1b222b; border-bottom-color: #2c3642; }
    /* THE NAME TAKES NO LINE OF ITS OWN: it authors no colour (the `#app-name` rule above carries the four truncation
       declarations and nothing else), so it INHERITS this one from the bar it stands in. A rule here would be a second
       spelling of the bar's ink. */
    body:has([theme="dark"]) .tab-row { background: #2b3542; border-color: #3a4654; color: #e8edf4; }
    body:has([theme="dark"]) .tab-row:hover { background: #3a4654; border-color: #3a4654; }
    /* THE ACTIVE CHIP INVERTS, WHICH IS THE LIGHT ARM'S OWN PROPORTION KEPT: `#1b2430` on `#ffffff` there, `#e8edf4` on
       `#1b222b` here — the emphasised row is the one that turns the page's foreground into its ground. */
    body:has([theme="dark"]) .tab-row[active="true"] { background: #e8edf4; border-color: #e8edf4; color: #1b222b; }
    body:has([theme="dark"]) #tab-add { background: #2b3542; border-color: #3a4654; color: #e8edf4; }
    body:has([theme="dark"]) #tab-add:hover { background: #3a4654; border-color: #3a4654; }

    /* ═══ **THE SCROLLBARS — `D-247`'s NAMED RESIDUAL, "the pinned light UA scrollbar", AND IT WAS NEVER THE TABS ROW'S
       ALONE.** ═══
       THE REPORT, VERBATIM: *"Dark mode scrollbars are unthemed"* — a sidebar pane painting a LIGHT scrollbar against the
       `#1b222b` dark surface. **THE CAUSE IS THE `:root` PIN AT THIS SHEET'S HEAD AND NOTHING ELSE, AND THE PIN IS RIGHT**:
       a scrollbar follows `color-scheme` and NEVER the `theme` attribute this app paints, so while the pin holds the UA's
       one arm EVERY scroll container takes a light thumb on a light track — in dark mode, on a dark surface, in all four
       zones, the stage, both panes, the tabs row and the operator panes' host alike.
       **WHAT IS NOT DONE HERE, SAID FIRST BECAUSE IT IS THE TEMPTATION**: the pin is NOT moved — not to `dark`, and not to
       a `body:has([theme="dark"])`-scoped `color-scheme: dark`. A scoped dark arm would paint dark scrollbars for free and
       would ALSO hand the UA's dark arm to every form control in that subtree (`input`'s bevel and caret, the demo
       buttons' chrome) — a second set of UA colours this sheet does not state, landing on the same subtree the pin was
       written to protect. The pin's reason stands byte for byte: the light surfaces keep the UA's light arm, and
       `color-scheme` still computes `light` on every element in both themes.
       **THE ANSWER IS THE STANDARD PROPERTY, DECLARED ONCE AND LEFT TO INHERIT — WHICH IS WHY NO CONTAINER CAN BE MISSED.**
       `scrollbar-color: <thumb> <track>` is an INHERITED property (CSS Scrollbars Styling 1), so this ONE declaration on the
       dark arm reaches EVERY scroll container in the realm: the four zones (`#top`/`#bottom`'s authored `overflow-x`,
       `#left`/`#right`'s `overflow-y`, re-painted per delivery by `renderer.ts`'s pane arm), the stage's authored
       `overflow: auto`, both panes (`#pane-menus` on whichever axis its zone gives it, `#gutter-pane`), the tabs row's
       `overflow-x: auto`, and `#panes`, the operator panes' off-screen host. **NO SELECTOR HERE NAMES A CONTAINER, A CLASS
       OR AN ID, SO THERE IS NO LIST TO GO STALE**: a scroll container a later pass authors inherits this pair the moment it
       exists — the overlay's dialog included, which carries `max-height` and so far no `overflow` — and the seam this
       sheet keeps finding (a surface themed on some containers and not others) has no place to open.
       **THE TWO COLOURS ARE THE BLOCK'S OWN PAIR AND NO NEW FIGURE**: the THUMB is `#3a4654`, the dark pair's STRONG border
       (the chip's hover, the `.btn`'s edge) — one step ABOVE a chip's `#2b3542` fill so the thumb reads as a control rather
       than as ground; the TRACK is `#1b222b`, the RAISED SURFACE (`.card`, `.top-bar`, the menus panel), so the tabs row's
       track IS the bar it lies in and a zone's track is the panel tone under the cards. Neither is a colour the pair above
       does not already carry. **THE LIGHT ARM IS UNTOUCHED**: `auto` — the UA's default — is what it keeps, it declares
       nothing new, and it still paints from the pin exactly as it painted before (confirmed rather than restated below).
       **AND THE GEOMETRY IS UNMOVED**: `scrollbar-width` is left at `auto`, so the gutter is the platform's own thickness
       in BOTH arms (measured: the tabs row's scrollbar height and each container's gutter width are identical in the two
       themes), and NO `::-webkit-scrollbar` rule is declared — that family would author a width and a shape of this
       sheet's where the standard property needs neither. Support is measured off this Electron's own Chromium rather than
       assumed: the computed value is readable on every container above, and the pixels under the panes and the tabs row
       were read with `import -window` in both themes. */
    body:has([theme="dark"]) { scrollbar-color: #3a4654 #1b222b; }

    /* THE OVERLAY LAYER'S VISIBILITY — PRESENTATION KEYED ON THE MECHANISM'S OWN PRODUCT, NEVER A SECOND STATE. The
       four-state machine (`src/shared/overlay.ts`) decides when the surface is up, and its DECLARED product on this
       tree is the `inert` attribute the consumer applies to the AUTHORED app root (`startOverlayApplication`: `open`
       and `held` are inert, `closed` and `closing` are the removal arm). So the layer is shown exactly while the root
       carries that attribute and never by a state re-derived here — one key, no transition words, no fourth state
       invented in CSS. THE GEOMETRY IS NOT IN THIS SHEET: it is the envelope's own `css` on the two authored nodes,
       which is why their authored style objects carry no `display` (an inline declaration would outrank this rule and
       pin a closed overlay open). */
    #overlay-scrim, #overlay-dialog { display: none; }
    #app-surface[inert] ~ #overlay-scrim,
    #app-surface[inert] ~ #overlay-dialog { display: block; }
  </style>
</head>
<body>
  <main>
    <div id="app"></div>
    <div id="panes"></div>
  </main>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
